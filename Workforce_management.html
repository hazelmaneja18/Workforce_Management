<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workforce Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Firebase settings live in firebase-config.js (made at deploy time from GitHub secrets). Not part of this file. -->
<script src="firebase-config.js"></script>
<style>
  :root{
    /* palette: #790D16 burgundy · #E5D3AF sand · #F5EFE1 cream · #AEC4D4 powder blue */
    --burgundy:#790D16;
    --burgundy-deep:#5A0A11;
    --sand:#E5D3AF;
    --cream:#F5EFE1;
    --blue:#AEC4D4;

    --ink:#4A0A10;
    --ink-2:#5A0A11;
    --paper:#F5EFE1;
    --paper-deep:#EBDFC3;
    --card:#FFFCF5;
    --rule:#E5D3AF;
    --rule-soft:#EFE5CD;
    --ink-text:#2E1416;
    --slate:#6B4F50;
    --slate-soft:#9C8683;

    --green:#27506B;
    --green-bg:#AEC4D4;
    --red:#790D16;
    --red-bg:#F0D3D3;
    --amber:#6E4F12;
    --amber-bg:#E5D3AF;
    --neutral-ink:#6B4F50;
    --neutral-bg:#EFE5CD;

    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 1px 2px rgba(121,13,22,0.05), 0 10px 28px rgba(121,13,22,0.07);

    --pal-mint:#E5D3AF;
    --brass:#790D16;
    --brass-dark:#5A0A11;
    --brass-tint:#F6E9DD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter', -apple-system, sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{ background: var(--brass); color:#fff; }
  .app{ display:flex; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:220px; flex-shrink:0;
    background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-deep) 100%);
    border-right:1px solid rgba(255,255,255,0.06);
    color:var(--cream); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ padding:26px 22px 18px 22px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .brand .mark{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .seal{
    width:30px;height:30px;border-radius:50%;
    background:color-mix(in srgb, var(--pal-mint) 20%, transparent);
    border:1px solid var(--pal-mint);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; color:var(--pal-mint);
    flex-shrink:0;
  }
  .brand h1{ font-family:'Inter',sans-serif; font-weight:800; font-size:17px; letter-spacing:-0.01em; margin:0; color:var(--cream); }
  .brand .tagline{ font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(229,211,175,0.75); margin-top:3px; }
  nav.navlist{ padding:16px 12px; flex:1; overflow-y:auto; }
  .navlist button{
    width:100%; display:flex; align-items:center; gap:11px; background:none; border:none;
    color:rgba(245,239,225,0.78); text-align:left; font-family:inherit; font-size:13.5px; font-weight:500;
    padding:9px 12px; border-radius:var(--radius-sm); cursor:pointer; letter-spacing:0.01em;
    margin-bottom:2px; transition:background 0.15s, color 0.15s;
  }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .navlist button.active{
    background:rgba(229,211,175,0.18); color:var(--sand); font-weight:600;
    box-shadow: inset 2px 0 0 var(--pal-mint);
  }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(229,211,175,0.55); padding:14px 12px 6px 12px; font-weight:600; }
  .sidebar-foot{ padding:14px 22px 18px 22px; border-top:1px solid rgba(255,255,255,0.1); font-size:11.5px; color:rgba(229,211,175,0.8); display:flex; flex-direction:column; gap:10px; }
  .sidebar-foot .month-chip{
    display:inline-flex;align-items:center;gap:6px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14); padding:5px 10px;border-radius:20px;
    color:var(--cream); font-weight:600; font-size:12px; width:fit-content;
  }
  .save-status{ display:flex; align-items:center; gap:7px; font-size:11px; color:rgba(229,211,175,0.85); }
  .save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); flex-shrink:0; }
  .save-status.error{ cursor:pointer; }
  .save-status.error .dot{ background:#F3A6AB; }
  .save-status.saving .dot{ background:var(--sand); }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(245,239,225,0.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule); padding:20px 36px; display:flex; align-items:center;
    justify-content:space-between; gap:20px;
  }
  .topbar h2{ font-family:'Lora',serif; font-size:24px; font-weight:700; margin:0; color:var(--ink); }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px;}
  .content{ padding:28px 36px 60px 36px; max-width:none; }

  .month-select{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--rule); border-radius:20px; padding:6px 6px 6px 14px; }
  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{ border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer; }

  /* ---------- CARDS / COMMON ---------- */
  .card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-header{ padding:16px 20px; border-bottom:1px solid var(--rule-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card-header h3{ font-family:'Lora',serif; font-size:16.5px; margin:0; font-weight:700; color:var(--ink);}
  .card-body{ padding:20px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(174,196,212,0.2); }
  .num{ font-family:'IBM Plex Mono',monospace; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px; }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }

  button.btn{ font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer; padding:9px 16px; border:1px solid transparent; transition:all 0.12s; }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }

  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text);
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--slate-soft); }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-family:'Lora',serif; color:var(--ink); font-size:17px; margin:0 0 6px 0; }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }

  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--burgundy-deep); color:var(--cream); padding:12px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px;
    border-left:3px solid var(--sand); animation: slidein 0.25s ease-out;
  }
  @keyframes slidein{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .loading-screen{
    position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:999;
  }
  .loading-screen .seal-lg{
    width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center;
    justify-content:center; font-family:'Inter',serif; font-weight:700; font-size:20px; color:var(--brass);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.4;} }
  .loading-screen p{ color:var(--slate); font-size:13px; letter-spacing:0.04em;}

  ::-webkit-scrollbar{ width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:6px;}
  ::-webkit-scrollbar-track{ background:transparent;}

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto;}
    .brand{ border-bottom:none; padding:14px 16px;}
    nav.navlist{ display:flex; padding:8px; }
    .sidebar-foot{ display:none; }
    .content{ padding:20px 16px 60px; }
    .topbar{ padding:16px; flex-direction:column; align-items:flex-start; gap:10px;}
    .field-grid{ grid-template-columns:1fr; }
  }

  /* ---------- WORKFORCE MANAGEMENT additions ---------- */
  .topbar h2{ color:var(--burgundy); }
  .lede{ margin:0 0 12px 0; font-size:13px; color:var(--slate); }
  ul.rules, ol.rules{ margin:0 0 16px 0; padding-left:20px; font-size:13px; color:var(--slate); line-height:1.65; }
  code{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--paper-deep); padding:1px 6px; border-radius:5px; color:var(--burgundy-deep); }
  .chip{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:2px 10px; border-radius:20px; white-space:nowrap; }
  .chip.new{ background:var(--blue); color:#1F4157; }
  .chip.upd{ background:var(--sand); color:#5B4210; }
  .chip.dup{ background:var(--neutral-bg); color:var(--slate); border:1px solid var(--rule); }
  .chip.warn{ background:var(--red-bg); color:var(--burgundy); }
  .result-panel{ margin-top:16px; padding:14px 16px; background:var(--paper); border:1px solid var(--rule); border-left:4px solid var(--burgundy); border-radius:var(--radius-sm); }
  .result-title{ font-weight:700; color:var(--burgundy); margin-bottom:8px; font-size:13.5px; }
  .result-panel details{ font-size:12.5px; color:var(--slate); }
  .result-panel summary{ cursor:pointer; font-weight:600; color:var(--burgundy-deep); }
  ul.plainlist{ margin:8px 0 0 0; padding-left:20px; columns:2; font-size:12.5px; }
  .match-tag{ display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:1px 7px; border-radius:10px; vertical-align:middle; cursor:help; }
  .match-tag.surname{ background:var(--blue); color:#1F4157; }
  .match-tag.firstname{ background:var(--sand); color:#6B3B08; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .kpi{ background:var(--card); border:1px solid var(--rule-soft); border-top:4px solid var(--burgundy); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .kpi.sand{ border-top-color:var(--sand); } .kpi.blue{ border-top-color:var(--blue); }
  .kpi-label{ font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--slate-soft); font-weight:700; }
  .kpi-value{ font-family:'Lora',serif; font-size:30px; font-weight:700; color:var(--burgundy); line-height:1.15; margin-top:4px; }
  .kpi-sub{ font-size:12px; color:var(--slate); margin-top:2px; }
  button.linkbtn{ background:none; border:none; padding:0; font:inherit; color:var(--burgundy); text-decoration:underline; cursor:pointer; }
  input[type=file]{ width:100%; font-size:13px; padding:8px; background:var(--paper); border:1px dashed var(--sand); border-radius:var(--radius-sm); color:var(--slate); }
  input[type=file]::file-selector-button{ background:var(--burgundy); color:var(--cream); border:none; padding:6px 12px; margin-right:10px; border-radius:6px; font-weight:600; cursor:pointer; }
  summary{ cursor:pointer; }
  div.field-label{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:2px; }
  @media (max-width:880px){ ul.plainlist{ columns:1; } }

  /* ---------- TOP NAVIGATION LAYOUT ---------- */
  .app{ flex-direction:column; }
  .topnav{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:36px; padding:0 40px; height:70px;
    background:var(--burgundy); border-bottom:3px solid var(--sand); box-shadow:0 6px 20px rgba(90,10,17,0.22); }
  .topnav .brand{ padding:0; border:none; flex-shrink:0; }
  .topnav .brand .mark{ margin:0; gap:12px; }
  .topnav .brand .seal{ width:38px; height:38px; font-size:13.5px; background:var(--sand); color:var(--burgundy); border:none; }
  .topnav .brand h1{ font-size:18px; white-space:nowrap; letter-spacing:0; }
  .topnav nav.navlist{ flex:1; display:flex; gap:6px; padding:0; overflow:visible; }
  .topnav .navlist button{ width:auto; margin:0; padding:10px 20px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:none; }
  .topnav .navlist button:hover:not(.active){ background:rgba(245,239,225,0.14); color:#fff; }
  .topnav .navlist button.active{ background:var(--cream); color:var(--burgundy); box-shadow:none; }
  .topnav .navlist button.active svg{ opacity:1; }
  .nav-right{ display:flex; align-items:center; gap:14px; margin-left:auto; flex-shrink:0; }
  .nav-right .month-chip{ display:none; }
  .main{ width:100%; }
  .topbar{ position:static; background:transparent; backdrop-filter:none; border:none; padding:34px 40px 4px; max-width:1360px; width:100%; margin:0 auto; }
  .topbar h2{ font-size:30px; }
  .content{ max-width:1360px; margin:0 auto; padding:20px 40px 80px; }

  .seg{ display:inline-flex; background:var(--paper-deep); border-radius:999px; padding:4px; gap:2px; margin-bottom:22px; }
  .seg button{ border:none; background:none; padding:9px 22px; border-radius:999px; font:inherit; font-weight:600; font-size:13px; color:var(--slate); cursor:pointer; transition:background .15s,color .15s; }
  .seg button:hover:not(.active){ color:var(--burgundy); }
  .seg button.active{ background:var(--burgundy); color:var(--cream); }
  .toolbar{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; margin-bottom:6px; }
  .filter-bar{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  .filter-bar .field{ margin:0 0 16px 0; min-width:210px; }
  @media (max-width:880px){
    .topnav{ height:auto; flex-wrap:wrap; padding:12px 16px; gap:10px; }
    .topnav nav.navlist{ order:3; width:100%; flex:none; overflow-x:auto; }
    .topbar{ padding:22px 16px 4px; }
    .content{ padding:16px 16px 60px; }
  }

  /* ---------- WIDE TREND VIEW ---------- */
  .main.wide .topbar, .main.wide .content{ max-width:none; }
  .main.wide .topbar, .main.wide .content{ padding-left:32px; padding-right:32px; }
  .user-chip{ display:inline-flex; align-items:center; gap:8px; background:rgba(245,239,225,0.14); color:var(--cream); border:1px solid rgba(229,211,175,0.35); padding:6px 14px; border-radius:999px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .user-chip:hover{ background:rgba(245,239,225,0.24); }
  .user-chip .uc-dot{ width:8px; height:8px; border-radius:50%; background:var(--sand); }
  .user-chip.empty{ border-style:dashed; } .user-chip.empty .uc-dot{ background:#F3A6AB; }
  .stat-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .trend-filters{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .trend-filters .field{ margin:0 0 18px 0; min-width:200px; }
  .trend-scroll{ overflow-x:auto; }
  .trend-table{ table-layout:fixed; width:100%; min-width:1300px; border-collapse:separate; border-spacing:0; }
  .trend-table th, .trend-table td{ padding:14px 8px; white-space:normal; }
  .trend-table th.num, .trend-table td.num{ text-align:center; }
  .trend-table td.mcell{ padding:14px 2px; }
  .trend-table td.emp-name{ font-weight:600; }
  .trend-table .zero{ color:var(--slate-soft); font-size:12px; }
  .nodata{ color:var(--sand); font-weight:700; }
  .trend-table tr.emp-row > td{ border-bottom:1px solid var(--rule-soft); }
  .trend-table tr.emp-row.open > td{ background:var(--brass-tint); border-bottom-color:transparent; }
  .trend-table td.total{ font-weight:700; }
  .trend-table td.spark svg{ width:96px; height:30px; }
  .trend-table td.spark{ padding-left:12px; padding-right:12px; }
  .status-sub{ font-size:11px; color:var(--slate); margin-top:4px; }
  .status-sub.need{ color:var(--burgundy); font-weight:600; }
  .detail-row{ display:none; }
  .detail-row.open{ display:table-row; }
  .detail-row > td{ padding:0 !important; background:var(--brass-tint); border-bottom:1px solid var(--rule); }
  .detail-panel{ padding:8px 28px 28px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .sec-title{ font-family:'Lora',serif; font-weight:700; color:var(--burgundy); font-size:14.5px; margin-bottom:8px; }
  .why{ font-size:12.5px; color:var(--slate); margin:0 0 16px 0; line-height:1.6; }
  .why .muted, .muted{ color:var(--slate-soft); }
  .form-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .form-row > div{ min-width:150px; }
  .form-row .grow{ flex:1; min-width:220px; }
  .btn-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .note-input{ width:100%; min-height:78px; font-size:13px; }
  .notes-list{ list-style:none; margin:16px 0 0 0; padding:0; display:flex; flex-direction:column; gap:10px; max-height:320px; overflow:auto; }
  .note-item{ background:var(--card); border:1px solid var(--rule); border-left:3px solid var(--burgundy); border-radius:8px; padding:10px 14px; }
  .note-text{ font-size:13px; white-space:pre-wrap; color:var(--ink-text); line-height:1.5; }
  .note-meta{ font-size:11.5px; color:var(--slate-soft); margin-top:6px; }
  .prev-wrap{ margin-top:24px; border-top:1px dashed var(--sand); padding-top:18px; }
  .prev-rec{ background:var(--card); border:1px solid var(--rule); border-radius:10px; margin-bottom:8px; padding:0 16px; }
  .prev-rec summary{ padding:12px 0; font-size:13px; cursor:pointer; }
  .prev-body{ padding:0 0 16px 0; }
  .rec-line{ font-size:12.5px; color:var(--slate); line-height:1.65; }
  .count-pill{ background:var(--burgundy); color:var(--cream); border-radius:999px; font-size:10.5px; padding:1px 7px; margin-left:4px; }
  details.how{ margin-top:20px; font-size:13px; }

<script>
/* =========================================================================
   WORKFORCE MANAGEMENT
   Attendance Import, Tardiness and Agent Roster, saved to Firebase so the
   whole team shares one live copy.
   ========================================================================= */

/* Agent roster seed \u2014 optional starting data so Team Lead matching has
   something to work with out of the box. Replace/remove freely; the Agent
   Roster page below lets you add, edit, and delete agents and team leads
   after the fact, and nothing here is required for Attendance/Tardiness to
   function (an empty roster just means everyone shows as "Unmatched"). */

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_NAMES[m-1]+' '+y; }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '\u2014'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }

let STATE = {
  agentRoster: [],
  deletedAgentRosterIds: [],
  teamLeadNames: [],
  campaignNames: [],
  onsiteRecords: {},
  onsiteNotes: {},
  wfhCampaigns: [],
  wfhPasses: {},
  wfhHistory: {},
  roleNames: [],
  attendanceLogs: [],
  attendanceUploadMeta: null,
  rosterUploadMeta: null,
  deletedAttendanceLogIds: [],
  attendancePolicyOverrides: {},
  attendanceNotes: {},
  deletedAttendancePolicyOverrideKeys: [],
  deletedAttendanceNoteKeys: [],
  tardinessPolicyOverrides: {},
  deletedTardinessPolicyOverrideKeys: [],
  tardinessNotes: {},
  deletedTardinessNoteKeys: []
};

/* ---------------------- PERSISTENCE: Firebase Realtime Database + local cache ----------------------
   Where things live in Firebase (all under /workforce-management):
     roster/{agentId}              one record per agent
     attendance/{empNo_date}       ONE record per employee per day  -> re-uploading overwrites, never doubles up
     kv/...                        policy overrides, notes, team lead names
     meta/...                      "last upload" info (who, when, how many new / updated / duplicate)
   Everything is shared live: when anyone uploads, everyone else's screen updates by itself. */
const STORAGE_KEY = 'wfm-local-cache-v1';
const LAST_MONTH_KEY = 'wfm-last-month';
const UPLOADER_KEY = 'wfm-uploader-name';
const FB_CONFIG_KEY = 'wfm-firebase-config';
const FB_ROOT = 'workforce-management';
const FB_SDK_VERSION = '10.12.2';

/* Firebase settings are NOT stored in this file. They come from firebase-config.js, which the GitHub deploy
   workflow writes from your repository secrets (or which you create locally \u2014 see SETUP.md). */
const WFM_CFG = (typeof window!=='undefined' && window.WFM_CONFIG) || {};
const FIREBASE_CONFIG = WFM_CFG.firebase || {};
const REQUIRE_SIGN_IN = WFM_CFG.requireSignIn===true || WFM_CFG.requireSignIn==='true';
const cfgReady = c=>!!(c && c.databaseURL && c.apiKey && !/^__/.test(c.databaseURL) && !/^__/.test(c.apiKey));

const LIST_KEYS = ['teamLeadNames','campaignNames','roleNames','wfhCampaigns'];
const NESTED_MAPS = ['onsiteRecords','onsiteNotes','wfhPasses','wfhHistory'];
const SMALL_MAPS = ['attendancePolicyOverrides','attendanceNotes','tardinessPolicyOverrides','tardinessNotes'];
const MAP_KEYS = SMALL_MAPS.concat(NESTED_MAPS);
let FB = { ready:false, db:null, root:null, lastFlat:{}, error:'', denied:false };
let hasUnsavedFailure = false;
let initialDone = false;
let lastDataSig = '';

function setSaveStatus(state, text){
  const wrap = document.getElementById('saveStatus');
  const label = document.getElementById('saveStatusText');
  if(!wrap || !label) return;
  wrap.classList.remove('saving','error');
  if(state) wrap.classList.add(state);
  label.textContent = text;
}
function isStorageReady(){
  try{ const k='__wfm_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function nowStamp(){ return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out talking to Firebase')), ms))]);
}

/* Firebase keys can't contain . $ # [ ] / so names are encoded when used as keys. */
function encKey(k){ return encodeURIComponent(String(k)).replace(/\./g,'%2E'); }
function decKey(k){ try{ return decodeURIComponent(k); }catch(e){ return k; } }

/* ---- config ---- */
function getFirebaseConfig(){
  return cfgReady(FIREBASE_CONFIG) ? FIREBASE_CONFIG : null;
}
// Accepts the snippet exactly as Firebase shows it ("const firebaseConfig = { ... };") or plain JSON.
function parseFirebaseConfigText(text){
  let t = String(text||'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a===-1 || b===-1) throw new Error('Paste the firebaseConfig block from the Firebase console.');
  t = t.slice(a, b+1)
    .replace(/^\s*\/\/.*$/gm,'')
    .replace(/'/g,'"')
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":')
    .replace(/,\s*}/g,'}');
  let c;
  try{ c = JSON.parse(t); }catch(e){ throw new Error('Couldn\u2019t read that config \u2014 copy the whole block from Firebase and try again.'); }
  if(!c.databaseURL) throw new Error('This config has no databaseURL. In Firebase, create a Realtime Database first, then copy the config again.');
  return c;
}
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve;
    s.onerror = ()=>reject(new Error('Could not load the Firebase library (check your internet connection).'));
    document.head.appendChild(s);
  });
}
async function fbConnect(cfg){
  const base = 'https://www.gstatic.com/firebasejs/'+FB_SDK_VERSION+'/';
  if(!window.firebase){
    await loadScriptOnce(base+'firebase-app-compat.js');
    await loadScriptOnce(base+'firebase-database-compat.js');
  }
  if(REQUIRE_SIGN_IN && !firebase.auth) await loadScriptOnce(base+'firebase-auth-compat.js');
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  FB.db = firebase.database();
  FB.root = FB.db.ref(FB_ROOT);
}

/* ---- optional sign-in (turn on with requireSignIn in firebase-config.js) ---- */
function authUserLabel(u){ return (u && (u.displayName || (u.email||'').split('@')[0])) || ''; }
function afterSignIn(u){ FB.user = u; setUserName(authUserLabel(u)); }
async function ensureSignedIn(){
  const auth = firebase.auth();
  const existing = await new Promise(res=>{ const off = auth.onAuthStateChanged(u=>{ off(); res(u); }); });
  if(existing){ afterSignIn(existing); return existing; }
  return new Promise(resolve=>{
    const loading = document.getElementById('loading'); if(loading) loading.style.display = 'none';
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<form class="modal" id="signInForm"><h3>Sign in to Workforce Management</h3>
      <label class="field-label">Email</label><input type="email" id="siEmail" autocomplete="username" required>
      <label class="field-label" style="margin-top:12px; display:block;">Password</label><input type="password" id="siPass" autocomplete="current-password" required>
      <p class="field-hint" id="siMsg" style="margin:10px 0 0; color:var(--red); min-height:18px;"></p>
      <div class="modal-actions"><button type="button" class="btn ghost" id="siReset">Forgot password</button><button type="submit" class="btn brass" id="siGo">Sign in</button></div></form>`;
    document.body.appendChild(ov);
    const msg = ov.querySelector('#siMsg'), email = ov.querySelector('#siEmail');
    email.focus();
    const nice = e=>/invalid|wrong|not-found|credential/i.test((e.code||'')+(e.message||'')) ? 'That email or password isn\u2019t right.' : /too-many/i.test(e.code||'') ? 'Too many attempts \u2014 wait a few minutes and try again.' : (e.message||'Could not sign in.');
    ov.querySelector('#signInForm').addEventListener('submit', async ev=>{
      ev.preventDefault(); msg.style.color = 'var(--slate)'; msg.textContent = 'Signing in\u2026';
      try{
        const cred = await auth.signInWithEmailAndPassword(email.value.trim(), ov.querySelector('#siPass').value);
        ov.remove(); if(loading) loading.style.display = 'flex';
        afterSignIn(cred.user); resolve(cred.user);
      }catch(e){ msg.style.color = 'var(--red)'; msg.textContent = nice(e); }
    });
    ov.querySelector('#siReset').addEventListener('click', async ()=>{
      if(!email.value.trim()){ msg.style.color = 'var(--red)'; msg.textContent = 'Type your email first.'; return; }
      try{ await auth.sendPasswordResetEmail(email.value.trim()); msg.style.color = 'var(--slate)'; msg.textContent = 'Password reset email sent.'; }
      catch(e){ msg.style.color = 'var(--red)'; msg.textContent = nice(e); }
    });
  });
}

/* ---- remote -> STATE ---- */
function rebuildRoster(val){
  STATE.agentRoster = Object.entries(val||{}).map(([id,a])=>({
    id, name:a.name||'', teamLead:a.teamLead||'', location:a.location||'',
    campaign:canonCampaign(a.campaign||''), role:a.role||'', createdAt:a.createdAt||0
  })).filter(a=>a.name);
}
function rebuildKV(val){
  val = val || {};
  SMALL_MAPS.forEach(n=>{
    const o = {};
    Object.entries(val[n]||{}).forEach(([k,v])=>{ o[decKey(k)] = v; });
    STATE[n] = o;
  });
  LIST_KEYS.forEach(k=>{ STATE[k] = Object.keys(val[k]||{}).map(decKey); });
  NESTED_MAPS.forEach(n=>{ const o={}; Object.entries(val[n]||{}).forEach(([k,v])=>{ o[decKey(k)] = v||{}; }); STATE[n]=o; });
}
function rebuildMeta(val){
  STATE.attendanceUploadMeta = (val && val.attendanceUpload) || null;
  STATE.rosterUploadMeta = (val && val.rosterUpload) || null;
}
function rebuildAttendance(val){
  STATE.attendanceLogs = Object.entries(val||{}).map(([id,v])=>({
    id, empName:v.n, empNumber:v.e||'', date:v.d, month:(v.d||'').slice(0,7),
    category:v.c, lateMinutes:v.l||0, remarks:v.x||'', uploadId:v.u||''
  })).filter(r=>r.empName && r.date);
}
function compactLog(r){
  return { n:r.empName, e:r.empNumber||null, d:r.date, c:r.category, l:r.lateMinutes||0, x:r.remarks||null, u:r.uploadId||null };
}

/* ---- small shared data: diffed so two people editing different things never overwrite each other ---- */
function flattenSmall(){
  const m = {};
  (STATE.agentRoster||[]).forEach(a=>{
    m['roster/'+a.id] = { name:a.name, teamLead:a.teamLead||'', location:a.location||'', campaign:a.campaign||'', role:a.role||'', createdAt:a.createdAt||0 };
  });
  SMALL_MAPS.forEach(n=>{
    Object.entries(STATE[n]||{}).forEach(([k,v])=>{ m['kv/'+n+'/'+encKey(k)] = JSON.parse(JSON.stringify(v)); });
  });
  LIST_KEYS.forEach(k=>{ (STATE[k]||[]).forEach(t=>{ m['kv/'+k+'/'+encKey(t)] = true; }); });
  NESTED_MAPS.forEach(n=>{ Object.entries(STATE[n]||{}).forEach(([k,inner])=>{ Object.entries(inner||{}).forEach(([id,v])=>{ m['kv/'+n+'/'+encKey(k)+'/'+id] = JSON.parse(JSON.stringify(v)); }); }); });
  if(STATE.attendanceUploadMeta) m['meta/attendanceUpload'] = JSON.parse(JSON.stringify(STATE.attendanceUploadMeta));
  if(STATE.rosterUploadMeta) m['meta/rosterUpload'] = JSON.parse(JSON.stringify(STATE.rosterUploadMeta));
  return m;
}
function djb2(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return h; }
function dataSig(){
  const am = STATE.attendanceUploadMeta, rm = STATE.rosterUploadMeta;
  return [
    (STATE.attendanceLogs||[]).length, am?am.uploadedAt:0, rm?rm.uploadedAt:0,
    djb2(JSON.stringify([STATE.agentRoster, MAP_KEYS.map(n=>STATE[n]), LIST_KEYS.map(k=>STATE[k])]))
  ].join('|');
}

/* ---- local cache (fast start / offline fallback) ---- */
function cacheLocal(){
  if(!isStorageReady() || getFirebaseConfig()) return;     // Firebase is the only copy

  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...STATE, attendanceLogs:[] })); }catch(e2){}
  }
}
function loadLocalCache(){
  if(!isStorageReady()) return;
  if(getFirebaseConfig()){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} return; }   // clear any old copy
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    STATE.agentRoster = p.agentRoster || [];
    LIST_KEYS.forEach(k=>{ STATE[k] = p[k] || []; });
    STATE.agentRoster = STATE.agentRoster.map(a=>({ ...a, campaign:canonCampaign(a.campaign||'') }));
    STATE.attendanceLogs = p.attendanceLogs || [];
    STATE.attendanceUploadMeta = p.attendanceUploadMeta || null;
    STATE.rosterUploadMeta = p.rosterUploadMeta || null;
    MAP_KEYS.forEach(n=>{ STATE[n] = p[n] || {}; });
  }catch(e){ console.error('Local cache unreadable', e); }
}

/* ---- load / connect ---- */
async function loadState(){
  loadLocalCache();
  const cfg = getFirebaseConfig();
  if(!cfg){ setSaveStatus(null, 'Local only \u2014 Firebase isn\u2019t configured'); return true; }
  const localBackup = { roster:STATE.agentRoster, att:STATE.attendanceLogs, small:MAP_KEYS.map(n=>STATE[n]), lists:Object.fromEntries(LIST_KEYS.map(k=>[k,STATE[k]||[]])), am:STATE.attendanceUploadMeta, rm:STATE.rosterUploadMeta };
  try{
    setSaveStatus('saving', 'Connecting to Firebase\u2026');
    await withTimeout(fbConnect(cfg), 20000);
    if(REQUIRE_SIGN_IN) await ensureSignedIn();      // waits for the person to sign in
    const first = {};
    const attach = (name, rebuild)=> new Promise(resolve=>{
      FB.root.child(name).on('value', snap=>{
        rebuild(snap.val());
        if(!first[name]){ first[name] = true; resolve(); }
        else if(initialDone) onRemoteChange();
      }, err=>{
        FB.denied = true; FB.error = err && err.message ? err.message : String(err);
        if(!first[name]){ first[name] = true; resolve(); }
      });
    });
    await withTimeout(Promise.all([
      attach('roster', rebuildRoster), attach('attendance', rebuildAttendance),
      attach('kv', rebuildKV), attach('meta', rebuildMeta)
    ]), 20000);
    if(FB.denied) throw new Error(FB.error || 'Firebase refused access (check your database rules).');
    FB.ready = true;
    // First time on a brand-new database: carry over whatever was already on this device.
    const remoteEmpty = !STATE.agentRoster.length && !STATE.attendanceLogs.length;
    if(remoteEmpty && (localBackup.roster.length || localBackup.att.length)){
      STATE.agentRoster = localBackup.roster; STATE.attendanceLogs = localBackup.att;
      MAP_KEYS.forEach((n,i)=>{ STATE[n] = localBackup.small[i] || {}; });
      LIST_KEYS.forEach(k=>{ STATE[k] = localBackup.lists[k]||[]; }); STATE.attendanceUploadMeta = localBackup.am; STATE.rosterUploadMeta = localBackup.rm;
      FB.lastFlat = {};
      if(STATE.attendanceLogs.length) await pushAttendanceLogs(STATE.attendanceLogs);
      await saveState();
    } else {
      FB.lastFlat = flattenSmall();
    }
    cacheLocal();
    setSaveStatus(null, 'Live \u2014 connected to Firebase');
  }catch(e){
    console.error('Firebase connect failed', e);
    FB.ready = false; FB.error = e && e.message ? e.message : String(e);
    if(FB.root){ try{ FB.root.off(); }catch(_){} }
    STATE.agentRoster = localBackup.roster; STATE.attendanceLogs = localBackup.att;
    MAP_KEYS.forEach((n,i)=>{ STATE[n] = localBackup.small[i] || {}; });
    LIST_KEYS.forEach(k=>{ STATE[k] = localBackup.lists[k]||[]; }); STATE.attendanceUploadMeta = localBackup.am; STATE.rosterUploadMeta = localBackup.rm;
    setSaveStatus('error', 'Firebase unavailable \u2014 tap to retry');
  }
  return true;
}

let remoteTimer = null;
function onRemoteChange(){
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(function tryRender(){
    const sig = dataSig();
    if(sig === lastDataSig) return;
    const el = document.activeElement;
    if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){ remoteTimer = setTimeout(tryRender, 2500); return; }
    lastDataSig = sig;
    cacheLocal();
    if(typeof rolloverWfhPasses==='function' && rolloverWfhPasses()) saveState();
    render();

/* ---------------------- NAME MATCHING (attendance "SURNAME First Middle" <-> roster "First Last") ----------------------
   Tries, in order:
     1. exact       same set of name parts, any order (also when one side leaves out a middle name)
     2. surname     surname matches (spelling slips allowed) AND the first/middle name looks similar
     3. firstname   the surname does NOT match (married name, typo, etc.) but the first name is unique on the roster
   Anything that isn't an exact match is tagged in the tables so it can be double-checked. */
const NAME_SUFFIX = new Set(['jr','sr','ii','iii','iv']);
const NAME_PARTICLES = new Set(['de','dela','del','delos','delas','la','las','los','san','santa','van','von','da','di','ma']);
function nameTokensList(s){ return (s||'').toLowerCase().split(/\s+/).map(t=>t.replace(/[^a-z]/g,'')).filter(t=>t && !NAME_SUFFIX.has(t)); }
function editDist(a,b){
  const m=a.length, n=b.length, d=[];
  for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[m][n];
}
function tokenSimilar(a,b){
  if(a===b) return true;
  const mn = Math.min(a.length,b.length);
  if(mn>=3 && (a.startsWith(b) || b.startsWith(a))) return true;   // Judy ~ Judyliza
  if(mn>=5 && editDist(a,b)<=1) return true;                        // Joniel ~ Joneil, Paghasin ~ Paghasian
  let pre=0; while(pre<mn && a[pre]===b[pre]) pre++;
  if(mn>=5 && pre>=3 && editDist(a,b)<=2) return true;               // Franco ~ Frank
  return false;
}
function computeRosterMatch(empName, roster){
  const att = nameTokensList(empName);
  if(!att.length) return null;
  const attSet = new Set(att);
  const R = roster.map(a=>({ a, t:nameTokensList(a.name) })).filter(x=>x.t.length);
  // 1 - exact / one side missing a middle name
  const exact = R.filter(x=>{ const s=new Set(x.t); return s.size===attSet.size && [...attSet].every(t=>s.has(t)); });
  if(exact.length===1) return { agent:exact[0].a, how:'exact' };
  if(exact.length>1) return null;
  const sub = R.map(x=>{
    const s=new Set(x.t);
    const small = attSet.size<=s.size ? attSet : s, large = attSet.size<=s.size ? s : attSet;
    let ov=0; small.forEach(t=>{ if(large.has(t)) ov++; });
    return { x, isSub: ov===small.size, ov, diff:Math.abs(attSet.size-s.size) };
  }).filter(o=>o.isSub && o.ov>=2);
  if(sub.length){
    sub.sort((p,q)=>p.diff-q.diff);
    const best = sub.filter(o=>o.diff===sub[0].diff);
    return best.length===1 ? { agent:best[0].x.a, how:'exact' } : null;
  }
  // 2 - surname + similar given name
  const strip = arr=>arr.filter(t=>!NAME_PARTICLES.has(t));
  const c2 = [];
  R.forEach(x=>{
    if(x.t.length<2) return;
    const sur = x.t[x.t.length-1], given = strip(x.t.slice(0,-1));
    if(!given.length) return;
    for(let i=0; i<Math.min(2,att.length); i++){
      if(!tokenSimilar(att[i], sur)) continue;
      const rest = strip(att.filter((_,j)=>j!==i));
      if(given.some(g=>rest.some(t=>tokenSimilar(g,t)))){ c2.push({ a:x.a, exactSur:att[i]===sur }); break; }
    }
  });
  if(c2.length===1) return { agent:c2[0].a, how:'surname' };
  if(c2.length>1){
    const ex = c2.filter(c=>c.exactSur);
    return ex.length===1 ? { agent:ex[0].a, how:'surname' } : null;
  }
  // 3 - surname doesn't match, but the first name is unique
  const given3 = att.slice(1).filter(t=>!NAME_PARTICLES.has(t));
  const c3 = R.filter(x=>{ const f=x.t[0]; return f.length>=4 && !NAME_PARTICLES.has(f) && given3.some(t=>tokenSimilar(f,t)); });
  if(c3.length===1) return { agent:c3[0].a, how:'firstname' };
  return null;
}
let MATCH_CACHE = new Map(), MATCH_SIG = '';
function rosterMatchInfo(empName){
  const roster = STATE.agentRoster||[];
  const sig = roster.length + '|' + djb2(roster.map(a=>a.id+a.name+(a.teamLead||'')).join(';'));
  if(sig !== MATCH_SIG){ MATCH_SIG = sig; MATCH_CACHE = new Map(); }
  if(!MATCH_CACHE.has(empName)){
    let m = computeRosterMatch(empName, roster);
    if(!m){
      // not an agent -> maybe one of the team leads themselves (they appear in the attendance file too)
      const leads = rosterTeamLeads().map(n=>({ name:n, teamLead:'', isLead:true }));
      m = computeRosterMatch(empName, leads);
    }
    MATCH_CACHE.set(empName, m);
  }
  return MATCH_CACHE.get(empName);
}
function rosterMatchForAttendanceName(empName){
  const info = rosterMatchInfo(empName);
  return info ? info.agent : null;
}
function teamLeadCellHtml(emp){
  const info = rosterMatchInfo(emp.empName);
  if(!info) return '<span style="color:var(--slate-soft);">Unmatched</span>';
  if(info.agent.isLead) return '<span class="chip dup" title="This person is listed as a team lead on the roster ('+esc(info.agent.name)+')">Team Lead</span>';
  const lead = info.agent.teamLead ? esc(info.agent.teamLead) : '<span style="color:var(--slate-soft);">No lead set</span>';

    firstname:'Surname didn\u2019t match, so this was matched by first name only ('+info.agent.name+'). Please double-check.'
  };
  const tag = info.how==='exact' ? '' : ` <span class="match-tag ${info.how}" title="${esc(tips[info.how])}">${info.how==='surname'?'by surname':'verify'}</span>`;
  return lead + tag;
}

// Campaign names are kept short and consistent: Petro, Core, Dunkin, FSG (anything else is kept as typed).
function canonCampaign(c){
  const t=String(c||'').trim(); const l=t.toLowerCase();
  if(!t) return '';

  if(l.includes('core')) return 'Core';
  if(l.includes('dunkin')) return 'Dunkin';

function rosterKeyFromName(name){ return nameTokensList(name).slice().sort().join('_'); }
function cleanRosterName(s){ return String(s==null?'':s).replace(/\*/g,'').replace(/\s+/g,' ').trim(); }
function parseRosterWorkbook(arrayBuffer){

    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' });

}
// Upsert by person: new -> added, changed -> updated (overwritten), identical -> "Duplicate" (kept as is).
async function applyRosterUpload(rows, fileName, uploadedBy){
  const byKey = new Map();
  let fileDup = 0;
  rows.forEach(r=>{
    const k = rosterKeyFromName(r.name);
    if(!k) return;
    if(byKey.has(k)){ fileDup++; return; }
    byKey.set(k, r);
  });
  let added=0, updated=0, dupExisting=0;
  byKey.forEach((r,k)=>{
    const ex = (STATE.agentRoster||[]).find(a=>rosterKeyFromName(a.name)===k);
    if(!ex){
      STATE.agentRoster.push({ id:'rost_'+k, name:r.name, teamLead:r.teamLead, location:r.location||'', campaign:r.campaign, role:r.role, createdAt:Date.now() });
      added++;
      return;
    }
    const nl = r.teamLead||ex.teamLead||'', nc = r.campaign||ex.campaign||'', nr = r.role||ex.role||'', nloc = r.location||ex.location||'';
    if(nl===(ex.teamLead||'') && nc===(ex.campaign||'') && nr===(ex.role||'') && nloc===(ex.location||'')){ dupExisting++; return; }
    ex.teamLead = nl; ex.campaign = nc; ex.role = nr; ex.location = nloc;
    updated++;
  });
  STATE.rosterUploadMeta = { fileName:fileName||'', uploadedAt:Date.now(), uploadedBy:uploadedBy||'', rowCount:byKey.size, added, updated, duplicates:dupExisting+fileDup };
  await saveState();
  return { total:byKey.size, added, updated, duplicates:dupExisting+fileDup, fileDup, dupExisting };
}

function allMonthsUsed(){

  set.add(currentMonth);
  set.add(monthKey(new Date()));

// Normalizes the free-text "Remarks" column from the daily attendance export into
// one of the categories below. "...-Present" variants mean the person actually
// logged in that day (on a restday/holiday), so those count as Present, not as
// the restday/holiday itself.
function classifyAttendanceRemark(remark){
  const r = (remark||'').trim().toLowerCase();
  if(!r) return 'OTHER';
  if(r.includes('present')) return 'PRESENT';
  if(r.includes('no logout')) return 'PRESENT';
  if(r.includes('no login')) return 'NO_LOGIN';
  if(r === 'absent') return 'ABSENT';
  if(r.includes('vacation leave')) return 'VL';
  if(r.includes('emergency leave') || r.startsWith('el')) return 'EL';
  if(r.includes('sick leave') || r.startsWith('sl')) return 'SL';
  if(r.includes('paternity leave')) return 'PL';
  if(r.includes('restday')) return 'RESTDAY';
  if(r.includes('holiday')) return 'HOLIDAY';
  return 'OTHER';
}
// Converts whatever shape a date cell comes through as (JS Date, Excel serial
// number, or an already-formatted "YYYY-MM-DD" string) into a plain ISO date.
function normalizeAttendanceDate(value){
  if(!value) return null;
  if(value instanceof Date && !isNaN(value)) return value.toISOString().slice(0,10);
  if(typeof value === 'number'){
    const parsed = XLSX.SSF ? XLSX.SSF.parse_date_code(value) : null;
    if(parsed) return `${parsed.y}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}`;
    return null;
  }
  const str = String(value).trim();
  const m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  const m2 = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2) return `${m2[3]}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}`;
  return null;
}
// Title-cases a "SURNAME First Middle" style name from the export into something
// easier to read elsewhere in the UI (display-only, the raw name is still kept).
function toTitleCaseName(name){
  return (name||'').toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase()).replace(/\s+/g,' ').trim();
}
// Extracts just the time-of-day (minutes since midnight, seconds truncated
// \u2014 not rounded \u2014 so "5:23:20 PM" reads as 23 minutes past 5, not 24) from
// a Date object, a bare/full Excel serial number, a "H:MM(:SS)" 24-hour
// string, a "H:MM(:SS) AM/PM" string, or a full "MM/DD/YYYY H:MM:SS AM/PM"
// timestamp string (the TimeIn/SchedIn columns can come through as any of
// these depending on how the cell was formatted). Returns null if nothing
// recognizable is found, rather than guessing.
function parseTimeOfDayMinutes(value){
  if(value===null || value===undefined || value==='') return null;
  if(value instanceof Date && !isNaN(value)) return (value.getUTCHours()*60) + value.getUTCMinutes();
  if(typeof value === 'number'){
    const frac = value - Math.floor(value);
    return Math.floor(frac*1440);
  }
  const str = String(value).trim();
  if(!str) return null;
  const ampm = str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])/);
  if(ampm){
    let h = parseInt(ampm[1],10) % 12;
    if(ampm[4].toLowerCase()==='pm') h += 12;
    return h*60 + parseInt(ampm[2],10);
  }
  const hm = str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(hm) return (parseInt(hm[1],10)*60) + parseInt(hm[2],10);
  return null;
}
// Minutes late = actual TimeIn minus the scheduled SchedIn, comparing just
// the time-of-day on both sides (so it works whether the cell holds a bare
// time or a full date+time timestamp). Returns null if either side can't be
// read.
function computeLateMinutesFromSchedule(schedInValue, timeInValue){
  const sched = parseTimeOfDayMinutes(schedInValue);
  const actual = parseTimeOfDayMinutes(timeInValue);
  if(sched===null || actual===null) return null;
  let diff = actual - sched;
  if(diff < -600) diff += 1440; // guards against a rare midnight-boundary wrap
  return Math.max(0, diff);
}
function parseAttendanceWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  // Some exports have a title/date row above the real header row, so the header
  // row isn't always row 1 \u2014 scan the first several rows to find the one that
  // actually contains an EmpName-style column before parsing data from it.
  const grid = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
  // A second, formatted-text copy of the same sheet: SchedIn/TimeIn are read
  // from THIS one instead of the raw grid above. Some exports (particularly
  // older .xls-format files) convert cleanly to a Date object for some
  // values but not reliably for others, and a wrong Date conversion there
  // silently produces a wrong lateness number with no way to tell. Reading
  // the plain display text instead (e.g. "10/28/2026 18:30:00") sidesteps
  // that risk entirely.
  const textGrid = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
  const looksLikeNameHeader = c => {
    const v = String(c||'').trim().toLowerCase();
    return v==='empname' || v==='employee name' || v==='emp name' || v==='agent name';
  };
  let headerRowIdx = -1;
  for(let i=0; i<Math.min(grid.length, 15); i++){
    if((grid[i]||[]).some(looksLikeNameHeader)){ headerRowIdx = i; break; }
  }
  if(headerRowIdx===-1) return [];
  const headers = (grid[headerRowIdx]||[]).map(c=>String(c||'').trim());
  const findHeader = (...candidates) => headers.find(h=>candidates.includes(h.toLowerCase()));
  const nameKey = findHeader('empname','employee name','emp name','agent name');
  const dateKey = findHeader('date1','date','login date','work date');
  const remarksKey = findHeader('remarks','remark','status','attendance status','dtr remarks');
  // "Schedule" is included here too for exports that show the scheduled
  // shift as a single combined range like "8:00AM - 5:00PM" rather than a
  // separate start-time column \u2014 parseTimeOfDayMinutes only reads the FIRST
  // time it finds in whatever string it's given, so pointing it at that
  // combined value still correctly pulls out just the 8:00AM start and
  // ignores the 5:00PM end, even with a "[10/27]" date prefix in front of it.
  const schedInKey = findHeader('schedin','sched in','scheduled in','sched time in','schedule in','schedule','sched');
  const timeInKey = findHeader('timein','time in','actual time in','login time','actual in');
  const empNumKey = findHeader('empnumber','emp number','employee number','empno','emp no','employee id','emp id');
  const out = [];
  for(let i=headerRowIdx+1; i<grid.length; i++){
    const rawRow = grid[i];
    if(!rawRow || !rawRow.length) continue;
    const row = {};
    headers.forEach((h,idx)=>{ row[h] = rawRow[idx]; });
    const textRawRow = textGrid[i] || [];
    const textRow = {};
    headers.forEach((h,idx)=>{ textRow[h] = textRawRow[idx]; });
    const empName = nameKey ? String(row[nameKey]||'').trim() : '';
    const date = dateKey ? normalizeAttendanceDate(row[dateKey]) : null;
    if(!empName || !date) continue;
    // A day only counts as a tardiness instance when the Remarks column
    // itself says "Late" (e.g. "Present-Late") \u2014 that's what decides WHETHER
    // it's late. SchedIn vs TimeIn is then compared only for those rows, just
    // to work out HOW MANY minutes. The file's own Late column is never used
    // for this at all, since its encoding isn't consistent and can produce
    // wildly inflated values (close to 1440, a full day). Holiday remarks
    // (e.g. "Holiday-Present") are excluded even if "Late" also appears,
    // since holiday attendance isn't a regular scheduled shift and isn't
    // subject to the same tardiness policy. If Remarks doesn't mention
    // "Late", is a Holiday remark, or Sched/TimeIn can't be read, or the
    // computed gap is over 10 hours (not a plausible "late but still
    // present" gap), the day is simply not counted (0 minutes).
    const remarksText = remarksKey ? String(row[remarksKey]||'') : '';
    const remarksSayLate = /\blate\b/i.test(remarksText) && !/holiday/i.test(remarksText);
    let lateMinutes = (remarksSayLate && schedInKey && timeInKey) ? computeLateMinutesFromSchedule(textRow[schedInKey], textRow[timeInKey]) : null;
    if(lateMinutes===null || lateMinutes>600) lateMinutes = 0;
    out.push({
      empName,
      date,
      empNumber: empNumKey ? String(row[empNumKey]==null?'':row[empNumKey]).trim() : '',
      remarks: remarksText.trim(),
      category: classifyAttendanceRemark(remarksKey ? row[remarksKey] : ''),
      lateMinutes
    });
  }
  return out;
}
// Upload model: ONE record per employee per day (key = employee number + date).
//   New day            -> added
//   Same day, changed  -> overwritten ("Updated")  e.g. a No Login that was later corrected to Present
//   Same day, same data-> "Duplicate": the saved record is retained untouched
// So anyone can upload the latest export at any time and nothing is ever counted twice.
function attLogId(r){
  const who = r.empNumber ? String(r.empNumber).trim() : nameTokensList(r.empName).slice().sort().join('-');
  return ('a_' + who + '_' + r.date).replace(/[^A-Za-z0-9_\-]/g,'');
}
// When the same employee has two rows for one day in the SAME file (e.g. "Restday" + "Present"),
// keep the one that shows the person actually worked, then the one with lateness.
function attRowScore(r){ return (r.category==='PRESENT'?2:0) + ((r.lateMinutes||0)>0?1:0); }

}

    const rec = {
      id, empName:r.empName, empNumber:r.empNumber||'', date:r.date, month:r.date.slice(0,7),
      category:r.category, lateMinutes:r.lateMinutes||0, remarks:r.remarks||'', uploadId
    };
    const ex = existing.get(id);
    if(!ex){ added++; changed.push(rec); return; }
    const same = ex.empName===rec.empName && ex.category===rec.category && (ex.lateMinutes||0)===rec.lateMinutes && (ex.remarks||'')===rec.remarks;
    if(same){ dupExisting++; return; }          // Duplicate -> retained as is
    updated++; changed.push(rec);               // changed -> overwritten
  });
  // write to Firebase first (so a failed upload doesn't pretend it worked), then update the screen
  if(changed.length) await pushAttendanceLogs(changed);
  changed.forEach(rec=>existing.set(rec.id, rec));
  STATE.attendanceLogs = Array.from(existing.values());
  const duplicates = dupExisting + fileDup;
  STATE.attendanceUploadMeta = { uploadId, fileName:fileName||'', uploadedAt:now, uploadedBy:uploadedBy||'', rowCount:byId.size, added, updated, duplicates };
  await saveState();
  // who in this file isn't on the roster (or only matched loosely)?
  const names = Array.from(new Set(Array.from(byId.values()).map(r=>r.empName))).sort();
  const unmatched = [], loose = [];
  names.forEach(n=>{
    const info = rosterMatchInfo(n);
    if(!info) unmatched.push(n);
    else if(info.how!=='exact') loose.push({ name:n, rosterName:info.agent.name, how:info.how });
  });
  // the month that just got updated = latest month with data up to today
  const today = new Date().toISOString().slice(0,10);
  const months = Array.from(byId.values()).filter(r=>r.date<=today).map(r=>r.date.slice(0,7)).sort();
  const latestMonth = months.length ? months[months.length-1] : Array.from(byId.values()).map(r=>r.date.slice(0,7)).sort().pop();
  // onsite status after this upload, compared with before it
  const after = Object.values(onsiteSnapshot());
  const needNow = after.filter(s=>s.need);
  const newlyNeed = needNow.filter(s=>!(onsiteBefore[s.kind+'|'+s.emp] || {}).need);
  const onsite = { need:needNow.length, newlyNeed, inEffect:after.filter(s=>s.inEffect).length };
  return { total:byId.size, added, updated, duplicates, fileDup, dupExisting, unmatched, loose, employees:names.length, latestMonth, onsite };
}
async function clearAttendanceLogs(){
  if(FB.ready) await withTimeout(FB.root.child('attendance').remove(), 60000);
  STATE.attendanceLogs = [];
  STATE.attendanceUploadMeta = null;
  await saveState();
}

function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
// Groups a sorted list of unique "YYYY-MM-DD" absence dates into consecutive-day
// runs, so a 3-day stretch of absences shows up as one streak instead of three
// separate entries. When dayCategoryMap (date -> category) is supplied, a gap
// made up entirely of Rest Day(s) doesn't break the streak \u2014 e.g. Sick Leave,
// then a Rest Day, then Absent still counts as one continuous occurrence,
// since a Rest Day was never a scheduled work day. Any other day in the gap
// (Present, VL, etc.) still breaks the streak as normal.
function computeAbsenceStreaks(sortedDates, dayCategoryMap){
  const streaks = [];
  let start = null, end = null;
  sortedDates.forEach(d=>{
    if(start === null){ start = d; end = d; return; }
    const gapDays = Math.round((new Date(d+'T00:00:00') - new Date(end+'T00:00:00'))/86400000);
    let bridges = gapDays === 1;
    if(!bridges && gapDays > 1 && dayCategoryMap){
      bridges = true;
      for(let g=1; g<gapDays; g++){
        if(dayCategoryMap.get(addDaysToDateStr(end, g)) !== 'RESTDAY'){ bridges = false; break; }
      }
    }
    if(bridges){ end = d; }
    else { streaks.push({ start, end }); start = d; end = d; }
  });
  if(start !== null) streaks.push({ start, end });
  return streaks;
}
// Per-employee attendance summary for a given month (or all months when month is
// null): login/present days, rest days, VL/EL/SL counts, absence dates, and the
// absence streaks within that set so repeated/consecutive absences stand out.
function attendanceSummaryByEmployee(month){
  const byEmp = new Map();
  const dayCategoryByEmp = new Map();
  (STATE.attendanceLogs||[])
    .filter(r=>!month || r.month===month)
    .forEach(r=>{
      if(!byEmp.has(r.empName)) byEmp.set(r.empName, { empName:r.empName, present:0, restday:0, vl:0, el:0, sl:0, pl:0, holiday:0, noLogin:0, other:0, absentDates:[] });
      const bucket = byEmp.get(r.empName);
      if(!dayCategoryByEmp.has(r.empName)) dayCategoryByEmp.set(r.empName, new Map());
      dayCategoryByEmp.get(r.empName).set(r.date, r.category);
      if(r.category==='PRESENT') bucket.present++;
      else if(r.category==='RESTDAY') bucket.restday++;
      else if(r.category==='VL') bucket.vl++;
      else if(r.category==='EL') bucket.el++;
      else if(r.category==='SL'){ bucket.sl++; bucket.absentDates.push(r.date); }
      else if(r.category==='PL') bucket.pl++;
      else if(r.category==='HOLIDAY') bucket.holiday++;
      else if(r.category==='ABSENT') bucket.absentDates.push(r.date);
      else if(r.category==='NO_LOGIN') bucket.noLogin++;
      else bucket.other++;
    });
  return Array.from(byEmp.values()).map(b=>{
    const sortedAbsences = Array.from(new Set(b.absentDates)).sort();
    const dayCategoryMap = dayCategoryByEmp.get(b.empName);
    const streaks = computeAbsenceStreaks(sortedAbsences, dayCategoryMap);
    const longestStreak = streaks.reduce((max,s)=>{
      const len = Math.round((new Date(s.end+'T00:00:00') - new Date(s.start+'T00:00:00'))/86400000) + 1;
      return Math.max(max, len);
    }, 0);
    // "Absences" is the number of distinct absence occurrences, not a raw day
    // count, and is strictly limited to "Absent" and "Sick Leave" remarks \u2014
    // "No Login" is tracked separately (bucket.noLogin) and never counts here.
    // A 3-day run of consecutive Absent/Sick Leave days is one occurrence; if
    // the person is present in between and then absent again, that's a second
    // occurrence. A Rest Day sitting in between does not break the occurrence
    // (it's not a scheduled work day), but a Present or VL day in between does.
    return { ...b, absentDates: sortedAbsences, totalAbsentDays: sortedAbsences.length, absences: streaks.length, streaks, longestStreak };
  }).sort((a,b)=>a.empName.localeCompare(b.empName));
}
// Distinct months actually present in the uploaded attendance log, sorted
// ascending \u2014 used to populate the From/To range pickers for the trend view.
function attendanceMonthsAvailable(){
  return Array.from(new Set((STATE.attendanceLogs||[]).map(r=>r.month).filter(Boolean))).sort();
}
// Per-employee absence occurrence counts for each month in [fromMonth, toMonth],
// reusing attendanceSummaryByEmployee's occurrence logic for every month in the
// range so the monthly trend view and the single-month summary always agree.
function attendanceTrendData(fromMonth, toMonth){
  const allMonths = attendanceMonthsAvailable();
  const months = allMonths.filter(m => (!fromMonth || m>=fromMonth) && (!toMonth || m<=toMonth));
  const byEmp = new Map();
  months.forEach(m=>{
    attendanceSummaryByEmployee(m).forEach(emp=>{
      if(!byEmp.has(emp.empName)) byEmp.set(emp.empName, { empName: emp.empName, perMonth:{}, perMonthStreaks:{}, total:0 });
      const bucket = byEmp.get(emp.empName);
      bucket.perMonth[m] = emp.absences;
      bucket.perMonthStreaks[m] = emp.streaks;
      bucket.total += emp.absences;
    });
  });
  const employees = Array.from(byEmp.values()).sort((a,b)=> b.total-a.total || a.empName.localeCompare(b.empName));
  return { months, employees };
}
function absenceCountBadgeClass(n){ return n>=2 ? 'red' : (n===1 ? 'amber' : 'neutral'); }
// Turns a list of absence streaks into a short, readable string of dates/
// ranges, e.g. "Aug 1, 2026, Aug 10 \u2013 Aug 12, 2026 (3d)" \u2014 used for hover
// tooltips and for explaining why the onsite policy triggered.
function formatStreakList(streaks){
  if(!streaks || !streaks.length) return 'No absences';
  return streaks.map(s=>{
    const len = Math.round((new Date(s.end+'T00:00:00') - new Date(s.start+'T00:00:00'))/86400000) + 1;
    return s.start===s.end ? fmtDate(s.start) : `${fmtDate(s.start)} \u2013 ${fmtDate(s.end)} (${len}d)`;
  }).join(', ');
}
// Finds the worst (highest-count) 30-day window within a list of occurrences.
// When multiple windows tie for that count, keeps the most recent one
// (occurrences are processed in ascending date order).
function worstAbsenceWindow(occurrences){
  let best = { count:0, occurrences:[] };
  occurrences.forEach(o=>{
    const windowStart = addDaysToDateStr(o.start, -29);
    const windowOcc = occurrences.filter(x=>x.start>=windowStart && x.start<=o.start);
    if(windowOcc.length >= best.count && windowOcc.length>0) best = { count: windowOcc.length, occurrences: windowOcc };
  });
  return best;
}
// Attendance/onsite policy: looks at an employee's FULL absence history (not
// just the months currently shown) and checks every 30-day window ending on
// an absence occurrence. 2 occurrences in any such window => onsite for two
// weeks; 3+ => onsite until further notice, monitored for 60 days from the
// most recent absence before a hybrid recommendation can be made.
//
// "onsitePeriod" is an optional { start, end } date range the supervisor sets
// once the onsite requirement notice has gone out:
//   - Today is before End \u2192 the requirement is currently in effect (level 1,
//     informational, not flagged red/amber since it's already being handled).
//   - Today is on/after End \u2192 the period has run its course. If no absence
//     newer than End has shown up since, it auto-refreshes to OK on its own
//     (no manual click needed) the next time this is evaluated. If a NEW
//     absence landed after End, the stale period is ignored and the policy
//     re-evaluates fresh from that newest absence \u2014 "starts again from the
//     last time absent."
// Older overrides saved before Start/End existed (just { overriddenAt }) are
// treated as an instantaneous period (start=end=overriddenAt) for compatibility.
function evaluateAttendancePolicy(fullHistoryEntry, onsitePeriod){
  if(onsitePeriod && onsitePeriod.overriddenAt && !onsitePeriod.start){
    onsitePeriod = { start: onsitePeriod.overriddenAt, end: onsitePeriod.overriddenAt };
  }
  if(!fullHistoryEntry || !fullHistoryEntry.streaks.length){
    return { level:0, label:'OK', reason:'No absence occurrences on file.', monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null };
  }
  const occurrences = [...fullHistoryEntry.streaks].sort((a,b)=>a.start.localeCompare(b.start));
  const today = new Date().toISOString().slice(0,10);

  if(onsitePeriod && onsitePeriod.end){
    const stillInEffect = today < onsitePeriod.end;
    if(stillInEffect){
      const best = worstAbsenceWindow(occurrences);
      return {
        level:1, label:'Onsite (In Effect)',
        reason:`Onsite requirement in effect from ${fmtDate(onsitePeriod.start)} to ${fmtDate(onsitePeriod.end)}. Originally triggered by ${best.count} instance${best.count===1?'':'s'}: ${formatStreakList(best.occurrences)}.`,
        monitorUntil: onsitePeriod.end, canOverride:false, overridden:false, onsitePeriod
      };
    }
    const postPeriodOccurrences = occurrences.filter(o=>o.start>onsitePeriod.end);
    if(!postPeriodOccurrences.length){
      const best = worstAbsenceWindow(occurrences);
      return {
        level:0, label:'OK (Completed)',
        reason:`Onsite requirement completed on ${fmtDate(onsitePeriod.end)} (period: ${fmtDate(onsitePeriod.start)} \u2013 ${fmtDate(onsitePeriod.end)}). Originally triggered by ${best.count} instance${best.count===1?'':'s'}: ${formatStreakList(best.occurrences)}.`,
        monitorUntil:null, canOverride:false, overridden:true, onsitePeriod
      };
    }
    const freshBest = worstAbsenceWindow(postPeriodOccurrences);
    const freshLastEnd = postPeriodOccurrences[postPeriodOccurrences.length-1].end;
    if(freshBest.count>=3){
      return {
        level:3, label:'Onsite Until Further Notice',
        reason:`Onsite period completed ${fmtDate(onsitePeriod.end)}, but ${freshBest.count} new absence instances since then within a 30-day window: ${formatStreakList(freshBest.occurrences)}.`,
        monitorUntil: addDaysToDateStr(freshLastEnd, 60), canOverride:true, overridden:false, onsitePeriod:null
      };
    }
    if(freshBest.count===2){
      return {
        level:2, label:'Onsite for 2 Weeks',
        reason:`Onsite period completed ${fmtDate(onsitePeriod.end)}, but 2 new absence instances since then within a 30-day window: ${formatStreakList(freshBest.occurrences)}.`,
        monitorUntil: addDaysToDateStr(freshLastEnd, 14), canOverride:true, overridden:false, onsitePeriod:null
      };
    }
    return {
      level:0, label:'OK',
      reason: `Onsite requirement completed on ${fmtDate(onsitePeriod.end)}. ${postPeriodOccurrences.length} absence instance${postPeriodOccurrences.length===1?'':'s'} since then \u2014 below the 2-instance threshold.`,
      monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null
    };
  }

  const best = worstAbsenceWindow(occurrences);
  const lastOccurrenceEnd = occurrences[occurrences.length-1].end;
  if(best.count>=3){
    return {
      level:3, label:'Onsite Until Further Notice',
      reason:`${best.count} absence instances within a 30-day window: ${formatStreakList(best.occurrences)}.`,
      monitorUntil: addDaysToDateStr(lastOccurrenceEnd, 60), canOverride:true, overridden:false, onsitePeriod:null
    };
  }
  if(best.count===2){
    return {
      level:2, label:'Onsite for 2 Weeks',
      reason:`2 absence instances within a 30-day window: ${formatStreakList(best.occurrences)}.`,
      monitorUntil: addDaysToDateStr(lastOccurrenceEnd, 14), canOverride:true, overridden:false, onsitePeriod:null
    };
  }
  return {
    level:0, label:'OK',
    reason: `${occurrences.length} absence instance${occurrences.length===1?'':'s'} on file \u2014 below the 2-instance threshold.`,
    monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null
  };
}
// Small inline SVG bar chart (no external chart library) showing one bar per
// month so an upward run of absences is visible at a glance per employee.
// Hovering a bar shows that month's actual absence date(s) via the native
// SVG <title> tooltip. "streaksPerMonth[i]" can be either raw absence-streak
// objects (formatted via formatStreakList) or an already-formatted string
// (used by the Tardiness trend, whose instances have a different shape).
function renderAbsenceSparkline(counts, months, streaksPerMonth, emptyLabel){
  const barW = 12, gap = 4, h = 32;
  const max = Math.max(1, ...counts);
  const width = Math.max(1, counts.length) * (barW+gap);
  const bars = counts.map((c,i)=>{
    const barH = c>0 ? Math.max(3, Math.round((c/max)*h)) : 2;
    const x = i*(barW+gap);
    const y = h-barH;
    const fill = c>=2 ? 'var(--red)' : (c===1 ? 'var(--amber)' : 'var(--rule)');
    const monthLbl = (months && months[i]) ? monthLabel(months[i]) : '';
    const raw = streaksPerMonth && streaksPerMonth[i];
    const dateInfo = raw ? (typeof raw === 'string' ? raw : formatStreakList(raw)) : (emptyLabel || 'No absences');
    const tooltip = `${monthLbl}: ${dateInfo}`;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="2" fill="${fill}"><title>${esc(tooltip)}</title></rect>`;
  }).join('');
  return `<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" style="display:block;">${bars}</svg>`;
}

/* =========================================================================
   TARDINESS POLICY \u2014 driven by SchedIn vs TimeIn (gated on Remarks="Late")
   ========================================================================= */
// Monday-anchored work-week key for a given date, so instances within the
// same Mon\u2013Sun week group together for the weekly tardiness rules.
function getWorkWeekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diffToMonday);
  return d.toISOString().slice(0,10);
}
// Formats a list of {date, minutes} tardiness instances, e.g.
// "Oct 03, 2026 (15 min), Oct 10, 2026 (22 min)".
function describeLateInstances(list){
  if(!list || !list.length) return 'none';
  return list.map(i=>`${fmtDate(i.date)} (${i.minutes} min)`).join(', ');
}
// Per-employee tardiness instances for a given month (or all months when
// month is null): every day with Late minutes > 0, sorted by date.
function tardinessSummaryByEmployee(month){
  const byEmp = new Map();
  (STATE.attendanceLogs||[])
    .filter(r=>!month || r.month===month)
    .forEach(r=>{
      const minutes = r.lateMinutes||0;
      if(minutes<=0) return;
      if(!byEmp.has(r.empName)) byEmp.set(r.empName, { empName:r.empName, instances:[] });
      byEmp.get(r.empName).instances.push({ date:r.date, minutes });
    });
  return Array.from(byEmp.values()).map(b=>{
    const sorted = [...b.instances].sort((a,c)=>a.date.localeCompare(c.date));
    return {
      empName: b.empName,
      instances: sorted,
      count: sorted.length,
      totalMinutes: sorted.reduce((s,i)=>s+i.minutes,0),
      longestMinutes: sorted.reduce((m,i)=>Math.max(m,i.minutes),0)
    };
  }).sort((a,b)=>a.empName.localeCompare(b.empName));
}
// Worst (highest-count) 30-day window within a list of {date,minutes}
// instances \u2014 same approach as worstAbsenceWindow, for the "5 instances
// within 30 days" rule.
function worstLateWindow(instances){
  let best = { count:0, instances:[] };
  instances.forEach(o=>{
    const windowStart = addDaysToDateStr(o.date, -29);
    const windowInst = instances.filter(x=>x.date>=windowStart && x.date<=o.date);
    if(windowInst.length >= best.count && windowInst.length>0) best = { count: windowInst.length, instances: windowInst };
  });
  return best;
}
// The most recent work week that qualifies under either weekly rule: one
// instance over 10 minutes, or 2+ instances in the same week regardless of
// how many minutes each one is.
function worstLateWeek(instances){
  const byWeek = new Map();
  instances.forEach(inst=>{
    const wk = getWorkWeekKey(inst.date);
    if(!byWeek.has(wk)) byWeek.set(wk, []);
    byWeek.get(wk).push(inst);
  });
  let trigger = null;
  Array.from(byWeek.keys()).sort().forEach(wk=>{
    const insts = byWeek.get(wk);
    const exceeds10 = insts.some(i=>i.minutes>10);
    if(exceeds10 || insts.length>=2){
      trigger = { weekStart: wk, instances: insts, reason: exceeds10 ? 'an instance exceeded 10 minutes' : '2 or more instances in the same work week' };
    }
  });
  return trigger;
}
function tardinessTrigger(instances){
  const monthWindow = worstLateWindow(instances);
  if(monthWindow.count>=5) return { level:3, group: monthWindow.instances };
  const weekTrigger = worstLateWeek(instances);
  if(weekTrigger) return { level:2, group: weekTrigger.instances, weekStart: weekTrigger.weekStart, weekReason: weekTrigger.reason };
  return { level:0, group:[] };
}
function describeTardinessTrigger(trig){
  if(!trig || !trig.group.length) return '';
  if(trig.level===3) return `Triggered by ${trig.group.length} tardiness instances within a 30-day window: ${describeLateInstances(trig.group)}.`;
  if(trig.level===2) return `Triggered by the work week of ${fmtDate(trig.weekStart)} \u2014 ${trig.weekReason}: ${describeLateInstances(trig.group)}.`;
  return '';
}
// Tardiness/onsite policy, mirroring evaluateAttendancePolicy's onsite-period
// mechanics (In Effect \u2192 auto-completes on End date \u2192 restarts from the
// newest instance if a fresh one lands after End), but driven by the
// tardiness rules instead of the absence rules:
//   - 1 instance over 10 minutes in the current work week \u2192 onsite 2 weeks.
//   - 2+ instances in the same work week (any duration) \u2192 onsite 2 weeks.
//   - 5+ instances within any 30-day window \u2192 onsite for a month / until
//     improvement is seen, with the lead recommending hybrid again after.
function evaluateTardinessPolicy(fullHistoryEntry, onsitePeriod){
  if(onsitePeriod && onsitePeriod.overriddenAt && !onsitePeriod.start){
    onsitePeriod = { start: onsitePeriod.overriddenAt, end: onsitePeriod.overriddenAt };
  }
  if(!fullHistoryEntry || !fullHistoryEntry.instances.length){
    return { level:0, label:'OK', reason:'No tardiness instances on file.', monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null };
  }
  const instances = [...fullHistoryEntry.instances].sort((a,b)=>a.date.localeCompare(b.date));
  const today = new Date().toISOString().slice(0,10);

  if(onsitePeriod && onsitePeriod.end){
    const stillInEffect = today < onsitePeriod.end;
    if(stillInEffect){
      const trig = tardinessTrigger(instances);
      return {
        level:1, label:'Onsite (In Effect)',
        reason:`Onsite requirement (tardiness) in effect from ${fmtDate(onsitePeriod.start)} to ${fmtDate(onsitePeriod.end)}. ${describeTardinessTrigger(trig)}`,
        monitorUntil: onsitePeriod.end, canOverride:false, overridden:false, onsitePeriod
      };
    }
    const postInstances = instances.filter(i=>i.date>onsitePeriod.end);
    if(!postInstances.length){
      const trig = tardinessTrigger(instances);
      return {
        level:0, label:'OK (Completed)',
        reason:`Onsite requirement (tardiness) completed on ${fmtDate(onsitePeriod.end)} (period: ${fmtDate(onsitePeriod.start)} \u2013 ${fmtDate(onsitePeriod.end)}). ${describeTardinessTrigger(trig)}`,
        monitorUntil:null, canOverride:false, overridden:true, onsitePeriod
      };
    }
    const freshTrig = tardinessTrigger(postInstances);
    if(freshTrig.level===3){
      const lastDate = postInstances[postInstances.length-1].date;
      return {
        level:3, label:'Onsite for 1 Month (Tardiness)',
        reason:`Onsite period completed ${fmtDate(onsitePeriod.end)}, but ${freshTrig.group.length} new tardiness instances since then within a 30-day window: ${describeLateInstances(freshTrig.group)}.`,
        monitorUntil: addDaysToDateStr(lastDate, 30), canOverride:true, overridden:false, onsitePeriod:null
      };
    }
    if(freshTrig.level===2){
      const lastDate = freshTrig.group[freshTrig.group.length-1].date;
      return {
        level:2, label:'Onsite for 2 Weeks (Tardiness)',
        reason:`Onsite period completed ${fmtDate(onsitePeriod.end)}, but a new tardiness trigger occurred \u2014 work week of ${fmtDate(freshTrig.weekStart)} (${freshTrig.weekReason}): ${describeLateInstances(freshTrig.group)}.`,
        monitorUntil: addDaysToDateStr(lastDate, 14), canOverride:true, overridden:false, onsitePeriod:null
      };
    }
    return {
      level:0, label:'OK',
      reason: `Onsite requirement (tardiness) completed on ${fmtDate(onsitePeriod.end)}. ${postInstances.length} tardiness instance${postInstances.length===1?'':'s'} since then \u2014 below threshold.`,
      monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null
    };
  }

  const trig = tardinessTrigger(instances);
  if(trig.level===3){
    const lastDate = trig.group[trig.group.length-1].date;
    return {
      level:3, label:'Onsite for 1 Month (Tardiness)',
      reason:`${trig.group.length} tardiness instances within a 30-day window: ${describeLateInstances(trig.group)}.`,
      monitorUntil: addDaysToDateStr(lastDate, 30), canOverride:true, overridden:false, onsitePeriod:null
    };
  }
  if(trig.level===2){
    const lastDate = trig.group[trig.group.length-1].date;
    return {
      level:2, label:'Onsite for 2 Weeks (Tardiness)',
      reason:`Work week of ${fmtDate(trig.weekStart)} \u2014 ${trig.weekReason}: ${describeLateInstances(trig.group)}.`,
      monitorUntil: addDaysToDateStr(lastDate, 14), canOverride:true, overridden:false, onsitePeriod:null
    };
  }
  return {
    level:0, label:'OK',
    reason: `${instances.length} tardiness instance${instances.length===1?'':'s'} on file \u2014 below threshold.`,
    monitorUntil:null, canOverride:false, overridden:false, onsitePeriod:null
  };
}
// Per-employee monthly tardiness-instance counts across a From/To month
// range, mirroring attendanceTrendData.
function tardinessTrendData(fromMonth, toMonth){
  const allMonths = attendanceMonthsAvailable();
  const months = allMonths.filter(m => (!fromMonth || m>=fromMonth) && (!toMonth || m<=toMonth));
  const byEmp = new Map();
  months.forEach(m=>{
    tardinessSummaryByEmployee(m).forEach(emp=>{
      if(!byEmp.has(emp.empName)) byEmp.set(emp.empName, { empName: emp.empName, perMonth:{}, perMonthInstances:{}, total:0 });
      const bucket = byEmp.get(emp.empName);
      bucket.perMonth[m] = emp.count;
      bucket.perMonthInstances[m] = emp.instances;
      bucket.total += emp.count;
    });
  });
  const employees = Array.from(byEmp.values()).sort((a,b)=> b.total-a.total || a.empName.localeCompare(b.empName));
  return { months, employees };
}
