function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function toastRetry(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = 'var(--red)';
  el.style.cursor = 'pointer';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.addEventListener('click', ()=>{ el.remove(); saveState(); });
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.isConnected){ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); } }, 6000);
}

function attachExtraHandlers(){
  attachSummaryFilters();

    if(b.dataset.impactGo==='attendance'){ attendanceActiveTab = 'trend'; setView('attendanceImport'); }

  }));
  attachSettingsHandlers();
  attachTrendHandlers();
  attachWfhHandlers();
  const rosterBtn = document.getElementById('rosterUploadBtn');
  if(rosterBtn){
    rosterBtn.addEventListener('click', async ()=>{
      const fileInput = document.getElementById('rosterUploadFile');
      const hint = document.getElementById('rosterUploadHint');
      const file = fileInput.files[0];
      if(!file){ hint.style.color='var(--red)'; hint.textContent='Choose the roster file first.'; return; }
      if(typeof XLSX==='undefined'){ hint.style.color='var(--red)'; hint.textContent='Spreadsheet reader failed to load \u2014 check your connection.'; return; }
      const by = rememberUploader('rosterUploader');
      try{
        rosterBtn.disabled = true;
        hint.style.color='var(--slate-soft)'; hint.textContent='Reading file\u2026';
        const rows = parseRosterWorkbook(await file.arrayBuffer());
        if(!rows.length){ hint.style.color='var(--red)'; hint.textContent='Couldn\u2019t find an \u201cAgent Name\u201d column in this file.'; rosterBtn.disabled=false; return; }
        hint.textContent = FB.ready ? 'Saving to Firebase\u2026' : 'Saving\u2026';
        lastRosterResult = await applyRosterUpload(rows, file.name, by);
        render();
        toast(`Roster uploaded \u2014 ${lastRosterResult.added} new, ${lastRosterResult.updated} updated, ${lastRosterResult.duplicates} duplicate`);
      }catch(err){
        console.error(err);
        hint.style.color='var(--red)'; hint.textContent='Could not read or save that file \u2014 ' + (err && err.message ? err.message : 'make sure it is the roster export.');
        rosterBtn.disabled = false;
      }
    });
  }
  const fbSave = document.getElementById('fbSaveBtn');
  if(fbSave){
    fbSave.addEventListener('click', async ()=>{
      const hint = document.getElementById('fbHint');
      try{
        const cfg = parseFirebaseConfigText(document.getElementById('fbConfigText').value);
        localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
        hint.style.color='var(--slate-soft)'; hint.textContent='Connecting\u2026';
        await reconnectFirebase();
      }catch(err){ hint.style.color='var(--red)'; hint.textContent = err.message; }
    });
  }
  const fbRetry = document.getElementById('fbRetryBtn');
  if(fbRetry) fbRetry.addEventListener('click', ()=>reconnectFirebase());
  const fbDis = document.getElementById('fbDisconnectBtn');
  if(fbDis) fbDis.addEventListener('click', ()=>{
    if(!confirm('Disconnect from Firebase on this device? The data stays in Firebase; this browser will just stop syncing.')) return;
    try{ localStorage.removeItem(FB_CONFIG_KEY); }catch(e){}
    location.reload();
  });
}
async function reconnectFirebase(){
  initialDone = false;
  if(FB.root){ try{ FB.root.off(); }catch(e){} }
  FB = { ready:false, db:null, root:null, lastFlat:{}, error:'', denied:false };
  document.getElementById('loading').style.display = 'flex';
  await loadState();
  initialDone = true;
  updateUserChip();
  await migrateLegacyNotes();
  if(rolloverWfhPasses()) await saveState();
  { const roll = ()=>{ if(rolloverWfhPasses()){ saveState(); render(); } };
    setInterval(roll, 15*60*1000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) roll(); }); }
  lastDataSig = dataSig();
  document.getElementById('loading').style.display = 'none';
  render();
  toast(FB.ready ? 'Connected to Firebase' : 'Could not connect: ' + (FB.error || 'unknown error'), !FB.ready);
}

  return tabs + `<p class="lede" style="margin:0 0 14px 0;">${live}</p>` + renderAttendanceUploadCard();
}

function applyRosterSearch(){
  const term = rosterSearchTerm.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('#rosterTable tbody tr[data-roster-row]').forEach(row=>{
    const ok = !term || (row.dataset.rosterSearch||'').includes(term);
    row.style.display = ok ? '' : 'none';
    if(ok) visible++;
  });
  const empty = document.getElementById('rosterSearchEmpty');
  if(empty) empty.style.display = (visible===0 && document.getElementById('rosterTable')) ? 'block' : 'none';
}

function attachRosterHandlers(){
  document.querySelectorAll('[data-roster-panel]').forEach(b=>b.addEventListener('click', ()=>{
    rosterPanel = rosterPanel===b.dataset.rosterPanel ? null : b.dataset.rosterPanel; render();
  }));
  const fc = document.getElementById('rosterFilterCampaign');
  if(fc) fc.addEventListener('change', ()=>{ rosterFilterCampaign = fc.value; rosterFilterLead = ''; render(); });
  const fl = document.getElementById('rosterFilterLead');
  if(fl) fl.addEventListener('change', ()=>{ rosterFilterLead = fl.value; render(); });
  const fx = document.getElementById('rosterFilterClear');
  if(fx) fx.addEventListener('click', ()=>{ rosterFilterCampaign=''; rosterFilterLead=''; render(); });
  const search = document.getElementById('rosterSearchInput');
  if(search){
    search.addEventListener('input', ()=>{ rosterSearchTerm = search.value; applyRosterSearch(); });
    if(rosterSearchTerm) applyRosterSearch();
  }
  // "+ Add new ..." reveals a text box
  [['newRosterCampaign','newRosterCampaignNew'],['newRosterRole','newRosterRoleNew'],['newRosterTeamLead','newRosterTeamLeadNew']].forEach(([s,i])=>{
    const sel = document.getElementById(s), inp = document.getElementById(i);
    if(sel && inp) sel.addEventListener('change', ()=>{ const isNew = sel.value===NEW_OPTION; inp.style.display = isNew?'':'none'; inp.required = isNew && (s==='newRosterCampaign' || s==='newRosterTeamLead'); if(isNew) inp.focus(); });
  });
  const addForm = document.getElementById('addRosterForm');
  if(addForm) addForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('newRosterName').value.trim();
    let teamLead = document.getElementById('newRosterTeamLead').value.trim();
    if(teamLead===NEW_OPTION) teamLead = document.getElementById('newRosterTeamLeadNew').value.trim();
    let campaign = document.getElementById('newRosterCampaign').value;
    let role = document.getElementById('newRosterRole').value;
    if(campaign===NEW_OPTION) campaign = canonCampaign(document.getElementById('newRosterCampaignNew').value.trim());
    if(role===NEW_OPTION) role = document.getElementById('newRosterRoleNew').value.trim();
    if(!name || !teamLead || !campaign) return;
    if((STATE.agentRoster||[]).find(a=>rosterKeyFromName(a.name)===rosterKeyFromName(name))){ toast('That agent is already on the roster.', true); return; }
    STATE.agentRoster.push({ id:uid('rost'), name, teamLead, location:'', campaign, role, createdAt:Date.now() });
    STATE.teamLeadNames = STATE.teamLeadNames||[]; STATE.campaignNames = STATE.campaignNames||[]; STATE.roleNames = STATE.roleNames||[];
    if(!STATE.teamLeadNames.some(t=>t.toLowerCase()===teamLead.toLowerCase())) STATE.teamLeadNames.push(teamLead);
    if(!BASE_CAMPAIGNS.includes(campaign) && !STATE.campaignNames.includes(campaign)) STATE.campaignNames.push(campaign);
    if(role && !STATE.roleNames.includes(role)) STATE.roleNames.push(role);
    await saveState();
    rosterPanel = 'agent';
    render();
    toast('Agent added');
  });
  const tlForm = document.getElementById('addTeamLeadForm');
  if(tlForm) tlForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('newTeamLeadName').value.trim();
    if(!name) return;
    STATE.teamLeadNames = STATE.teamLeadNames||[];
    if(rosterTeamLeads().some(t=>t.toLowerCase()===name.toLowerCase())){ toast('That team lead is already in the list.', true); return; }
    STATE.teamLeadNames.push(name);
    await saveState(); render(); toast('Team lead added');
  });
  document.querySelectorAll('.roster-edit').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const agent = (STATE.agentRoster||[]).find(a=>a.id===inp.dataset.rosterId);
      if(!agent) return;
      const field = inp.dataset.rosterField;
      if(field==='teamLead' && inp.value===NEW_OPTION){
        const n = await askText('New team lead', 'Team lead name', '', 'This agent will be assigned to them.');
        if(!n){ inp.value = agent.teamLead || ''; return; }
        agent.teamLead = n.trim();
        STATE.teamLeadNames = STATE.teamLeadNames||[];
        if(!STATE.teamLeadNames.some(t=>t.toLowerCase()===agent.teamLead.toLowerCase())) STATE.teamLeadNames.push(agent.teamLead);
        const ok2 = await saveState(); render(); if(ok2) toast('Assigned to '+agent.teamLead); return;
      }
      const val = inp.value.trim();
      if((field==='name'||field==='teamLead') && !val){ toast('This field can\u2019t be empty.', true); inp.value = agent[field]; return; }
      agent[field] = val;
      const ok = await saveState();
      if(ok){ toast('Agent updated'); if(field==='teamLead'||field==='campaign') render(); }
      else toastRetry('Updated here, but the save failed \u2014 tap to retry.');
    });
  });
  // --- tick agents -> assign them to a team lead together ---
  const picks = ()=>Array.from(document.querySelectorAll('.roster-pick'));
  const refreshBulk = ()=>{
    const n = picks().filter(p=>p.checked).length;
    const bar = document.getElementById('rosterBulkBar'); if(!bar) return;
    bar.style.display = n ? 'flex' : 'none';
    document.getElementById('rosterBulkCount').textContent = n + ' selected';
  };
  picks().forEach(p=>p.addEventListener('change', refreshBulk));
  const selAll = document.getElementById('rosterSelectAll');
  if(selAll) selAll.addEventListener('change', ()=>{ picks().forEach(p=>{ if(p.closest('tr').style.display!=='none') p.checked = selAll.checked; }); refreshBulk(); });
  const bulkClear = document.getElementById('rosterBulkClear');
  if(bulkClear) bulkClear.addEventListener('click', ()=>{ picks().forEach(p=>p.checked=false); if(selAll) selAll.checked=false; refreshBulk(); });
  const bulkApply = document.getElementById('rosterBulkApply');
  if(bulkApply) bulkApply.addEventListener('click', async ()=>{
    let lead = document.getElementById('rosterBulkLead').value;
    const ids = picks().filter(p=>p.checked).map(p=>p.dataset.rosterId);
    if(!ids.length) return;
    if(!lead){ toast('Choose a team lead first.', true); return; }
    if(lead===NEW_OPTION){ lead = await askText('New team lead', 'Team lead name', ''); if(!lead) return; lead = lead.trim(); }
    STATE.teamLeadNames = STATE.teamLeadNames||[];
    if(!STATE.teamLeadNames.some(t=>t.toLowerCase()===lead.toLowerCase())) STATE.teamLeadNames.push(lead);
    STATE.agentRoster.forEach(a=>{ if(ids.includes(a.id)) a.teamLead = lead; });
    const ok = await saveState(); render();
    if(ok) toast(`${ids.length} agent${ids.length===1?'':'s'} assigned to ${lead}`); else toastRetry('Assigned here, but the save failed \u2014 tap to retry.');
  });
  // --- Team Leads panel: rename / move whole team / remove empty lead ---
  document.querySelectorAll('.lead-rename').forEach(inp=>inp.addEventListener('change', async ()=>{
    const old = inp.dataset.lead, name = inp.value.trim();
    if(!name || name===old){ inp.value = old; return; }
    if(rosterTeamLeads().some(t=>t!==old && t.toLowerCase()===name.toLowerCase())){ toast('That team lead already exists \u2014 use \u201cMove the whole team\u201d to merge.', true); inp.value = old; return; }
    STATE.agentRoster.forEach(a=>{ if(a.teamLead===old) a.teamLead = name; });
    STATE.teamLeadNames = (STATE.teamLeadNames||[]).filter(t=>t!==old);
    STATE.teamLeadNames.push(name);
    if(rosterFilterLead===old) rosterFilterLead = name;
    if(attendanceTrendTeamLeadFilter===old) attendanceTrendTeamLeadFilter = name;
    if(tardinessTrendTeamLeadFilter===old) tardinessTrendTeamLeadFilter = name;
    if(typeof wfhLeadFilter!=='undefined' && wfhLeadFilter===old) wfhLeadFilter = name;
    const ok = await saveState(); render();
    if(ok) toast(`Renamed to ${name}`); else toastRetry('Renamed here, but the save failed \u2014 tap to retry.');
  }));
  document.querySelectorAll('[data-lead-move]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const from = btn.dataset.leadMove;
    const to = btn.closest('tr').querySelector('.lead-move-to').value;
    if(!to){ toast('Choose who they should move to.', true); return; }
    const n = STATE.agentRoster.filter(a=>a.teamLead===from).length;
    if(!confirm(`Move all ${n} agent${n===1?'':'s'} from ${from} to ${to}?`)) return;
    STATE.agentRoster.forEach(a=>{ if(a.teamLead===from) a.teamLead = to; });
    if(rosterFilterLead===from) rosterFilterLead = '';
    const ok = await saveState(); render();
    if(ok) toast(`${n} agent${n===1?'':'s'} moved to ${to}`); else toastRetry('Moved here, but the save failed \u2014 tap to retry.');
  }));
  document.querySelectorAll('[data-lead-remove]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const t = btn.dataset.leadRemove;
    if(!confirm(`Remove ${t} from the team lead list? They have no agents assigned.`)) return;
    STATE.teamLeadNames = (STATE.teamLeadNames||[]).filter(x=>x!==t);
    const ok = await saveState(); render();
    if(ok) toast('Team lead removed'); else toastRetry('Removed here, but the save failed \u2014 tap to retry.');
  }));
  document.querySelectorAll('[data-remove-roster]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.removeRoster;
      const agent = (STATE.agentRoster||[]).find(a=>a.id===id);
      if(!agent || !confirm(`Remove ${agent.name} from the agent roster?`)) return;
      STATE.agentRoster = STATE.agentRoster.filter(a=>a.id!==id);
      render();
      const ok = await saveState();
      if(ok) toast('Agent removed'); else toastRetry('Removed here, but the save failed \u2014 tap to retry.');
    });
  });
}

    settingsTab = b.dataset.settingsTab; rosterPanel = null; wfhPanel = null; render();

/* ======================================================================
   ONSITE TREND (Attendance + Tardiness): year view, expandable detail panel,
   dated note log, permanent onsite-requirement history with approver.
   Everything here lives in Firebase and is NEVER touched by attendance uploads.
   ====================================================================== */
let trendYear = null;
const expandedRows = new Set();

/* ---- who is doing this? ---- */
function currentUserName(){ try{ return (localStorage.getItem(UPLOADER_KEY)||'').trim(); }catch(e){ return ''; } }
function setUserName(n){ try{ localStorage.setItem(UPLOADER_KEY, n.trim()); }catch(e){} updateUserChip(); }
function updateUserChip(){
  const el = document.getElementById('userChipText'); if(!el) return;
  const n = currentUserName();
  el.textContent = n || 'Set your name';
  const chip = document.getElementById('userChip'); if(chip) chip.classList.toggle('empty', !n);
}
function askText(title, label, def, hint){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
      <label class="field-label">${esc(label)}</label>
      <input type="text" id="askTextInput" value="${esc(def||'')}" autocomplete="off">
      ${hint?`<p class="field-hint" style="margin-top:8px;">${esc(hint)}</p>`:''}
      <div class="modal-actions"><button type="button" class="btn ghost" id="askCancel">Cancel</button><button type="button" class="btn brass" id="askOk">Confirm</button></div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('#askTextInput'); inp.focus(); inp.select();
    const done = v=>{ ov.remove(); resolve(v); };
    ov.querySelector('#askOk').onclick = ()=>{ const v = inp.value.trim(); if(!v){ inp.focus(); return; } done(v); };
    ov.querySelector('#askCancel').onclick = ()=>done(null);
    ov.addEventListener('keydown', e=>{ if(e.key==='Enter') ov.querySelector('#askOk').click(); if(e.key==='Escape') done(null); });
  });
}
async function ensureUserName(){
  let n = currentUserName();
  if(n) return n;
  n = await askText('Who are you?', 'Your name', '', 'Every note and approval is logged with your name, the date and the time.');
  if(n) setUserName(n);
  return n || '';
}

/* ---- data helpers ---- */
const lk = (kind, emp)=>kind+'|'+emp;
const overrideMapName = kind=>kind==='attendance' ? 'attendancePolicyOverrides' : 'tardinessPolicyOverrides';
// same date basis the onsite status rules use, so "completed today" takes effect immediately
function todayIso(){ return new Date().toISOString().slice(0,10); }
function policyFor(kind, emp){
  const entry = (kind==='attendance' ? attendanceSummaryByEmployee(null) : tardinessSummaryByEmployee(null)).find(e=>e.empName===emp);
  return (kind==='attendance' ? evaluateAttendancePolicy : evaluateTardinessPolicy)(entry, (STATE[overrideMapName(kind)]||{})[emp] || null);
}
function toastLong(msg, isError){
  const wrap = document.getElementById('toastWrap'); const el = document.createElement('div');
  el.className = 'toast'; if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`; wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 9000);
}
function recordsFor(kind, emp){ return Object.values((STATE.onsiteRecords||{})[lk(kind,emp)]||{}); }
function notesFor(kind, emp){ return Object.values((STATE.onsiteNotes||{})[lk(kind,emp)]||{}); }
// A period saved before this version has no record yet: create one so it is kept in the history.
function ensureLegacyRecord(kind, emp){
  const om = STATE[overrideMapName(kind)] || {};
  const cur = om[emp];
  if(!cur || cur.recId) return cur ? cur.recId : null;
  STATE.onsiteRecords = STATE.onsiteRecords || {};
  const key = lk(kind,emp);
  STATE.onsiteRecords[key] = STATE.onsiteRecords[key] || {};
  const start = cur.start || cur.overriddenAt || '', end = cur.end || cur.overriddenAt || '';
  const id = 'onr_legacy_' + (cur.setAt || 0);
  STATE.onsiteRecords[key][id] = { id, kind, emp, requirement:'Onsite requirement', reason:'', start, end, approvedBy:cur.approvedBy||'', savedBy:'', savedAt:cur.setAt||0, status:'active', legacy:true };
  cur.recId = id;
  return id;
}
async function migrateLegacyNotes(){
  let changed = false;
  [['attendance','attendanceNotes'],['tardiness','tardinessNotes']].forEach(([kind, mapName])=>{
    const m = STATE[mapName] || {};
    Object.keys(m).forEach(emp=>{
      const text = (m[emp] && m[emp].text || '').trim();
      if(text){
        STATE.onsiteNotes = STATE.onsiteNotes || {};
        const key = lk(kind,emp);
        STATE.onsiteNotes[key] = STATE.onsiteNotes[key] || {};
        const id = 'note_legacy_' + kind + '_' + (djb2(emp)>>>0).toString(36);
        if(!STATE.onsiteNotes[key][id]){
          const recId = ensureLegacyRecord(kind, emp);   // earlier notes belong to the earlier requirement
          STATE.onsiteNotes[key][id] = { id, kind, emp, text, at:m[emp].updatedAt||0, by:'Earlier note', recId:recId||null, req:recId?'Onsite requirement':null, legacy:true };
        }
      }
      delete m[emp];
      changed = true;
    });
  });
  if(changed) await saveState();
}

// "onsite until" always counts from the LAST time the person violated (2 weeks; 1 month for tardiness level 3; 60 days for attendance level 3)
function onsiteUntil(kind, policy, last){
  const dur = policy.level===3 ? (kind==='attendance' ? 60 : 30) : 14;
  const fromLast = last ? addDaysToDateStr(last, dur) : '';
  const m = policy.monitorUntil || '';
  return m > fromLast ? m : fromLast;
}
function fmtShortDate(s){ if(!s) return ''; return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function recStatusLabel(r, today){
  if(r.status==='reopened') return { text:'Reopened', cls:'dup' };
  if(r.end && r.end < today || r.completedAt) return { text:'Completed', cls:'new' };
  return { text:'In effect', cls:'upd' };
}

        ${currentRecId?`<button type="button" class="btn ghost sm danger-text" data-del-record="${esc(currentRecId)}">Delete requirement</button>`:''}
      </div>`;
  } else if(policy.overridden && curRec){
    reqBox = `

  const prevHtml = prev.length ? `

    <div class="detail-grid">

      </div>
    </div>

  </div>`;

/* ---- actions ---- */
function panelInfo(btn){
  const p = btn.closest('[data-panel]');
  return { p, kind:p.dataset.kind, emp:p.dataset.emp, level:Number(p.dataset.level), label:p.dataset.label, reason:p.dataset.reason, thread:p.dataset.thread };
}
async function saveOnsitePeriodAction(btn){
  const info = panelInfo(btn);
  const start = info.p.querySelector('.ons-start').value, end = info.p.querySelector('.ons-end').value;
  const approver = info.p.querySelector('.ons-approver').value.trim();
  if(!start || !end){ toast('Please set both an onsite start and end date.', true); return; }
  if(end < start){ toast('Onsite end can\u2019t be before the start date.', true); return; }
  if(!approver){ toast('Please enter who approved this onsite requirement.', true); info.p.querySelector('.ons-approver').focus(); return; }
  const lastEvent = info.p.dataset.lastEvent || '';
  if(info.level!==1 && lastEvent && end < lastEvent){
    if(!confirm(`These dates end on ${fmtDate(end)}, but the latest violation on file is ${fmtDate(lastEvent)} \u2014 after this period.\n\nThe status will keep showing "needs onsite notice" because of that violation. Save these dates anyway (for the record)?`)) return;
  }
  const by = await ensureUserName(); if(!by) return;
  btn.disabled = true; btn.textContent = 'Saving\u2026';
  const { kind, emp } = info;
  const om = STATE[overrideMapName(kind)] = STATE[overrideMapName(kind)] || {};
  const key = lk(kind, emp);
  STATE.onsiteRecords = STATE.onsiteRecords || {}; STATE.onsiteRecords[key] = STATE.onsiteRecords[key] || {};
  STATE.onsiteNotes = STATE.onsiteNotes || {}; STATE.onsiteNotes[key] = STATE.onsiteNotes[key] || {};
  const now = Date.now();
  let rec, reusedExisting = false;
  if(info.level===1 && om[emp]){
    const id = ensureLegacyRecord(kind, emp);
    rec = STATE.onsiteRecords[key][id];
    Object.assign(rec, { start, end, approvedBy:approver, updatedAt:now, updatedBy:by, status:'active' });
  } else {
    ensureLegacyRecord(kind, emp);                       // keep any earlier period in the history
    const same = Object.values(STATE.onsiteRecords[key]).find(r=>r.start===start && r.end===end && r.status!=='reopened');
    if(same){                                            // same dates already saved: update it, never add a copy
      Object.assign(same, { approvedBy:approver, updatedAt:now, updatedBy:by, status:'active' });
      rec = same; reusedExisting = true;
    } else {
      rec = { id:uid('onr'), kind, emp, requirement:info.label, reason:info.reason, start, end, approvedBy:approver, savedBy:by, savedAt:now, status:'active' };
      STATE.onsiteRecords[key][rec.id] = rec;
    }
    Object.values(STATE.onsiteNotes[key]).filter(n=>!n.recId).forEach(n=>{ n.recId = rec.id; n.req = rec.requirement; });   // pending notes join this requirement
  }
  om[emp] = { start, end, setAt:now, recId:rec.id, approvedBy:approver };
  expandedRows.add(key);
  const ok = await saveState();
  if(ok){
    const after = policyFor(kind, emp);
    if(after.canOverride){
      toastLong(`Saved \u2014 but the status still needs a NEW onsite requirement, because there are violations after ${fmtDate(end)}${lastEvent?` (latest: ${fmtDate(lastEvent)})`:''}. Set a period that starts after them.`, true);
    } else {
      toast(reusedExisting ? `Those dates were already saved \u2014 updated (approved by ${approver})` : `Onsite requirement saved \u2014 approved by ${approver}`);
    }
    render();
  }
  else { btn.disabled = false; btn.textContent = 'Retry save'; toastRetry('Couldn\u2019t save \u2014 tap to try again.'); }
}
async function completeNowAction(btn){
  const info = panelInfo(btn); const { kind, emp } = info;
  const by = await ensureUserName(); if(!by) return;

function normalizePass(v){
  const s = String(v==null?'':v).trim().toUpperCase().replace(/\s+/g,' ');
  if(!s || s==='NO') return 'NO';
  if(s.startsWith('YES')){
    const rest = s.replace(/^YES\s*-?\s*/,'');
    if(/MONTH/.test(rest)) return 'YES - 1 MONTH';
    if(/\bDAY\b/.test(rest) && !/WORK/.test(rest)) return 'YES - 1 DAY';
    if(/^2\b/.test(rest)) return 'YES - 2 WORKWEEK';
    if(/^1\b|WORK/.test(rest)) return 'YES - 1 WORKWEEK';
    return rest ? 'YES - ' + rest : 'YES';
  }
  return s;
}
const isActivePass = p=>String(p||'').toUpperCase().startsWith('YES');
function wfhCampaignNames(){

  const set = new Set([...(STATE.wfhCampaigns||[]), ...Object.keys(STATE.wfhPasses||{}), ...(STATE.agentRoster||[]).map(a=>a.campaign)]);

function localIso(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// reads "10/26-10/30", "11/9 - 11/13", "10/26/2026-10/30/2026" or a single date; the year comes from the text, the email date, or today
function parseWfhRange(dateText, emailText){
  const t = String(dateText||''); if(!t.trim()) return null;
  const re = /(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{4}|\d{2}))?/g; const p = []; let m;
  while((m = re.exec(t))){
    const mo = +m[1], d = +m[2]; if(mo<1 || mo>12 || d<1 || d>31) return null;
    let y = m[3] ? +m[3] : null; if(y!==null && y<100) y += 2000;
    p.push({ mo, d, y });
  }
  if(!p.length) return null;
  const em = String(emailText||'').match(/\b(20\d{2})\b/);
  const now = new Date();
  let y0 = p[0].y || (em ? +em[1] : now.getFullYear());
  if(!p[0].y && !em && (new Date(y0, p[0].mo-1, p[0].d) - now) > 183*86400000) y0 -= 1;   // "12/28" read in January = last year
  const last = p[p.length-1];
  let y1 = last.y || y0;
  if(!last.y && (last.mo < p[0].mo || (last.mo===p[0].mo && last.d < p[0].d))) y1 = y0 + 1;   // 12/28-1/3
  const iso = (y,mo,d)=>y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return { start: iso(y0, p[0].mo, p[0].d), end: iso(y1, last.mo, last.d) };
}

function archiveWfhPass(campaign, rec, status, by){

function rolloverWfhPasses(){

function wfhRows(campaign){
  const stored = wfhList(campaign);
  const roster = (STATE.agentRoster||[]).filter(a=>a.campaign===campaign);
  const claimed = new Set(), link = new Map();
  stored.forEach(rec=>{                                   // 1) same person, same name parts
    const k = rosterKeyFromName(rec.name);
    const ra = roster.find(a=>!claimed.has(a.id) && rosterKeyFromName(a.name)===k);
    if(ra){ claimed.add(ra.id); link.set(rec.id, ra); }
  });
  stored.forEach(rec=>{                                   // 2) close matches (middle name missing, spelling slips)
    if(link.has(rec.id) || !roster.length) return;
    const m = computeRosterMatch(rec.name, roster.filter(a=>!claimed.has(a.id)));
    if(m && m.how!=='firstname'){ claimed.add(m.agent.id); link.set(rec.id, m.agent); }
  });
  const rows = stored.map(rec=>{ const ra = link.get(rec.id) || null; return { id:rec.id, rec, roster:ra, name:ra ? ra.name : rec.name, pass:rec.pass, date:rec.date||'', email:rec.email||'', approvedBy:rec.approvedBy||'', grantedAt:rec.grantedAt||0, grantedBy:rec.grantedBy||'', ord:rec.ord||0 }; });
  roster.filter(a=>!claimed.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(a=>{
    rows.push({ id:'r_'+a.id, rec:null, roster:a, name:a.name, pass:'NO', date:'', email:'', approvedBy:'', grantedAt:0, grantedBy:'', ord:1e6 });
  });
  return rows.sort((a,b)=>(a.ord-b.ord) || a.name.localeCompare(b.name));
}
function wfhLeadOf(row){
  if(row.roster) return row.roster.teamLead || '';

  return m && m.agent.teamLead ? m.agent.teamLead : '';

function nextWfhOrd(campaign){ return wfhList(campaign).reduce((m,a)=>Math.max(m,a.ord||0),0) + 1; }
function ensureWfhCampaign(name){
  STATE.wfhCampaigns = STATE.wfhCampaigns || []; STATE.wfhPasses = STATE.wfhPasses || {};
  if(!STATE.wfhCampaigns.includes(name)) STATE.wfhCampaigns.push(name);

function guessCampaignFromFile(fileName){

/* ---- Excel import: the "Agent | WFH PASS | DATE | EMAIL REQUEST RECEIVED" sheet ---- */
function parseWfhWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:'array' });
  const gridOf = sn=>XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' });
  const hasHeader = g=>g.slice(0,10).some(r=>(r||[]).some(c=>/^(agent|agent name|name)$/i.test(String(c).trim())) && (r||[]).some(c=>/wfh\s*pass/i.test(String(c))));
  const sn = wb.SheetNames.find(n=>hasHeader(gridOf(n)));
  if(!sn) return [];
  const grid = gridOf(sn);
  const hi = grid.findIndex((r,i)=>i<10 && (r||[]).some(c=>/wfh\s*pass/i.test(String(c))));
  const hdr = grid[hi].map(c=>String(c||'').trim().toLowerCase());
  const col = re=>hdr.findIndex(h=>re.test(h));
  const ni = col(/^(agent|agent name|name)$/), pi = col(/wfh\s*pass/), di = col(/^date/), ei = col(/email/);
  const out = [];
  for(let i=hi+1; i<grid.length; i++){
    const r = grid[i]||[];
    const name = cleanRosterName(r[ni]);
    if(!name) continue;
    out.push({ name, pass:normalizePass(r[pi]), date:String(di>=0?r[di]:'').trim(), email:String(ei>=0?r[ei]:'').trim() });
  }
  return out;
}

  const list = wfhList(campaign);
  const today = localIso();
  let added=0, updated=0, dupExisting=0, ord = nextWfhOrd(campaign);
  byKey.forEach((r,k)=>{
    const ex = list.find(a=>rosterKeyFromName(a.name)===k);
    const range = parseWfhRange(r.date, r.email);
    const past = isActivePass(r.pass) && range && range.end < today;          // already over -> belongs in the history
    if(past && ex && ((STATE.wfhHistory||{})[campaign+'|'+ex.id]||{})[wfhHistoryId({ pass:r.pass, date:r.date, email:r.email, grantedAt:'' })]){ dupExisting++; return; }
    if(!ex){
      const id = wfhKey(r.name);
      STATE.wfhPasses[campaign][id] = { id, name:r.name, pass:r.pass, date:r.date, email:r.email, ord:ord++, createdAt:Date.now() };
      added++; return;
    }
    if(ex.pass===r.pass && (ex.date||'')===r.date && (ex.email||'')===r.email){ dupExisting++; return; }
    ex.pass = r.pass; ex.date = r.date; ex.email = r.email; updated++;
  });
  rolloverWfhPasses();
  await saveState();
  return { campaign, fileName, total:byKey.size, added, updated, duplicates:dupExisting+fileDup };
}

/* ---- stats from the attendance file for the month picked at the top ---- */
function wfhStatsFor(kind, rows){
  const entries = kind==='attendance' ? attendanceSummaryByEmployee(currentMonth) : tardinessSummaryByEmployee(currentMonth);
  const pseudo = rows.map(r=>({ id:r.id, name:r.name }));
  const map = {};
  entries.forEach(e=>{
    const m = computeRosterMatch(e.empName, pseudo);
    if(m && m.how!=='firstname' && !map[m.agent.id]) map[m.agent.id] = e;
  });
  return map;
}

/* ---- handlers ---- */
function attachWfhHandlers(){
  document.querySelectorAll('[data-wfh-pill]').forEach(b=>b.addEventListener('click', ()=>{ wfhCampaignView = b.dataset.wfhPill; render(); }));
  const leadSel = document.getElementById('wfhLeadSel');
  if(leadSel) leadSel.addEventListener('change', ()=>{ wfhLeadFilter = leadSel.value; render(); });
  const search = document.getElementById('wfhSearch');
  const applySearch = ()=>{
    const term = wfhSearchTerm.trim().toLowerCase(); let vis = 0;
    document.querySelectorAll('tr[data-wfh-row]').forEach(r=>{ const ok = !term || r.dataset.wfhSearch.includes(term); r.style.display = ok?'':'none'; if(ok) vis++; });
    const e = document.getElementById('wfhSearchEmpty'); if(e) e.style.display = vis===0 ? 'block' : 'none';
  };
  if(search){ search.addEventListener('input', ()=>{ wfhSearchTerm = search.value; applySearch(); }); if(wfhSearchTerm) applySearch(); }

  // edit pass / date / email (saves as you go; no re-render so you can tab through the cells)
  document.querySelectorAll('[data-wfh-history]').forEach(b=>b.addEventListener('click', ()=>openWfhHistory(b.dataset.campaign, b.dataset.wfhHistory)));
  document.querySelectorAll('.wfh-edit').forEach(inp=>inp.addEventListener('change', async ()=>{
    const campaign = inp.dataset.campaign, id = inp.dataset.id, field = inp.dataset.field;
    STATE.wfhPasses = STATE.wfhPasses || {};
    let rec = (STATE.wfhPasses[campaign]||{})[id];
    const tr = inp.closest('tr');
    const setRow = (f, v)=>{ const el = tr && tr.querySelector(`.wfh-edit[data-field="${f}"]`); if(el) el.value = v; };
    if(!rec && id.startsWith('r_')){                      // a roster agent edited for the first time -> create their pass record
      const ra = (STATE.agentRoster||[]).find(a=>a.id===id.slice(2));
      if(!ra) return;
      ensureWfhCampaign(campaign);
      const nid = wfhKey(ra.name);
      rec = STATE.wfhPasses[campaign][nid] = STATE.wfhPasses[campaign][nid] || { id:nid, name:ra.name, pass:'NO', date:'', email:'', ord:nextWfhOrd(campaign), createdAt:Date.now() };
      if(tr) tr.querySelectorAll('.wfh-edit').forEach(x=>{ x.dataset.id = nid; });
    }
    if(!rec) return;
    const val = inp.value.trim();
    let archived = false;
    if(field==='pass'){
      const was = rec.pass;
      if(isActivePass(val) && !isActivePass(was)){                    // a pass is being granted -> record who approved it
        const by = await ensureUserName(); if(!by){ inp.value = was; return; }
        const who = await askText('Who approved this WFH pass?', 'Approved by', rec.approvedBy || lastWfhApprover(), `Saved with today\u2019s date and time, under your name (${by}).`);
        if(!who){ inp.value = was; return; }
        rec.pass = val; rec.approvedBy = who.trim(); rec.grantedAt = Date.now(); rec.grantedBy = by;
        setRow('approvedBy', rec.approvedBy);
      } else if(!isActivePass(val) && isActivePass(was)){             // cancelled early -> keep it in the history
        if(!confirm(`Cancel ${rec.name}\u2019s WFH pass? It will be saved to their history as cancelled and the agent goes back to NO.`)){ inp.value = was; return; }
        archiveWfhPass(campaign, rec, 'cancelled', currentUserName() || 'Someone'); archived = true;
        ['pass','date','email','approvedBy'].forEach(f=>setRow(f, f==='pass' ? 'NO' : ''));
      } else rec.pass = val;
    } else {
      rec[field] = val;
      if((field==='date' || field==='email') && isActivePass(rec.pass)){
        const r = parseWfhRange(rec.date, rec.email);
        if(r && r.end < localIso()){                                  // the dates are already over -> completed
          archiveWfhPass(campaign, rec, 'completed', currentUserName() || 'Someone'); archived = true;
          ['pass','date','email','approvedBy'].forEach(f=>setRow(f, f==='pass' ? 'NO' : ''));
          toast('Those dates are already over \u2014 saved to the history as completed.');
        }
      }
    }
    const sel = tr && tr.querySelector('select[data-field="pass"]'); if(sel) sel.dataset.pass = isActivePass(rec.pass) ? 'yes' : 'no';
    const c = document.getElementById('wfhActiveCount');
    if(c) c.textContent = document.querySelectorAll('tr[data-wfh-row] select[data-pass="yes"]').length + ' with a pass';
    const ok = await saveState();
    if(ok){ if(!archived) toast('Saved'); } else toastRetry('Saved here, but the sync failed \u2014 tap to retry.');
    if(archived || field==='pass') render();
  }));

  // Settings
  document.querySelectorAll('[data-wfh-panel]').forEach(b=>b.addEventListener('click', ()=>{ wfhPanel = wfhPanel===b.dataset.wfhPanel ? null : b.dataset.wfhPanel; render(); }));
  const cf = document.getElementById('wfhCampaignForm');
  if(cf){
    const inp = document.getElementById('wfhNewCampaign'); if(inp) inp.focus();
    cf.addEventListener('submit', async e=>{
      e.preventDefault();
      const name = canonCampaign(inp.value.trim());
      if(!name) return;
      if(wfhCampaignNames().some(c=>c.toLowerCase()===name.toLowerCase())){ toast('That campaign already exists.', true); return; }
      ensureWfhCampaign(name);
      await saveState();
      wfhPanel = null; wfhFocusCampaign = name; wfhCampaignView = name;
      render(); toast(`${name} created \u2014 type the first name in the empty cell`);
    });
  }
  document.querySelectorAll('.wfh-add-form').forEach(f=>f.addEventListener('submit', async e=>{
    e.preventDefault();
    const campaign = f.dataset.campaign;
    const inp = f.querySelector('.wfh-new-name');
    const name = cleanRosterName(inp.value);
    if(!name) return;
    if(wfhRows(campaign).some(a=>rosterKeyFromName(a.name)===rosterKeyFromName(name))){ toast('That name is already in this list.', true); return; }
    const id = wfhKey(name);
    STATE.wfhPasses = STATE.wfhPasses || {}; STATE.wfhPasses[campaign] = STATE.wfhPasses[campaign] || {};
    STATE.wfhPasses[campaign][id] = { id, name, pass:'NO', date:'', email:'', ord:nextWfhOrd(campaign), createdAt:Date.now() };
    await saveState();
    wfhFocusCampaign = campaign; render(); toast(`${name} added`);
  }));
  if(wfhFocusCampaign){
    const el = document.querySelector(`.wfh-new-name[data-campaign="${CSS.escape(wfhFocusCampaign)}"]`);
    if(el){ el.focus(); el.scrollIntoView({block:'center'}); }
    wfhFocusCampaign = '';
  }
  document.querySelectorAll('.wfh-name-edit').forEach(inp=>inp.addEventListener('change', async ()=>{
    const rec = ((STATE.wfhPasses||{})[inp.dataset.campaign]||{})[inp.dataset.id];
    const name = cleanRosterName(inp.value);
    if(!rec) return;
    if(!name){ toast('A name can\u2019t be empty \u2014 use the bin to remove it.', true); inp.value = rec.name; return; }
    rec.name = name;
    const ok = await saveState(); if(ok) toast('Saved'); else toastRetry('Saved here, but the sync failed \u2014 tap to retry.');
  }));
  document.querySelectorAll('[data-wfh-remove]').forEach(b=>b.addEventListener('click', async ()=>{
    const campaign = b.dataset.campaign, rec = ((STATE.wfhPasses||{})[campaign]||{})[b.dataset.wfhRemove];
    if(!rec || !confirm(`Remove ${rec.name} from the ${campaign} WFH PASS list?`)) return;
    delete STATE.wfhPasses[campaign][rec.id];
    delete (STATE.wfhHistory||{})[campaign+'|'+rec.id];
    render(); const ok = await saveState();
    if(ok) toast('Removed'); else toastRetry('Removed here, but the save failed \u2014 tap to retry.');
  }));
  document.querySelectorAll('[data-wfh-remove-campaign]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = b.dataset.wfhRemoveCampaign, n = wfhList(c).length;
    if(!confirm(`Remove the whole ${c} campaign${n?` and its ${n} agent${n===1?'':'s'}`:''} from WFH PASS?\n\nThis can\u2019t be undone.`)) return;
    STATE.wfhCampaigns = (STATE.wfhCampaigns||[]).filter(x=>x!==c);
    delete (STATE.wfhPasses||{})[c];
    Object.keys(STATE.wfhHistory||{}).forEach(k=>{ if(k.startsWith(c+'|')) delete STATE.wfhHistory[k]; });
    if(wfhCampaignView===c) wfhCampaignView = '';
    render(); const ok = await saveState();
    if(ok) toast('Campaign removed'); else toastRetry('Removed here, but the save failed \u2014 tap to retry.');
  }));

  // upload
  const csel = document.getElementById('wfhUploadCampaign'), cnew = document.getElementById('wfhUploadCampaignNew');
  if(csel && cnew) csel.addEventListener('change', ()=>{ cnew.style.display = csel.value===NEW_OPTION ? '' : 'none'; });
  const ufile = document.getElementById('wfhUploadFile');
  if(ufile && csel && cnew) ufile.addEventListener('change', ()=>{
    const g = ufile.files[0] ? guessCampaignFromFile(ufile.files[0].name) : '';
    if(!g) return;
    const hit = Array.from(csel.options).find(o=>o.value.toLowerCase()===g.toLowerCase());
    if(hit){ csel.value = hit.value; cnew.style.display = 'none'; } else { csel.value = NEW_OPTION; cnew.value = g; cnew.style.display = ''; }
  });
  const ubtn = document.getElementById('wfhUploadBtn');
  if(ubtn) ubtn.addEventListener('click', async ()=>{
    const hint = document.getElementById('wfhUploadHint'), file = ufile.files[0];
    const err = m=>{ hint.style.color='var(--red)'; hint.textContent = m; };
    if(!file) return err('Choose the WFH PASS file first.');
    if(typeof XLSX==='undefined') return err('Spreadsheet reader failed to load \u2014 check your connection.');
    const campaign = csel.value===NEW_OPTION ? canonCampaign(cnew.value.trim()) : csel.value;
    if(!campaign) return err('Enter a campaign name for this file.');
    try{
      ubtn.disabled = true; hint.style.color='var(--slate-soft)'; hint.textContent = 'Reading file\u2026';
      const rows = parseWfhWorkbook(await file.arrayBuffer());
      if(!rows.length){ ubtn.disabled = false; return err('Couldn\u2019t find a sheet with Agent and WFH PASS columns in this file.'); }
      lastWfhResult = await applyWfhUpload(rows, campaign, file.name);
      wfhCampaignView = campaign; render();
      toast(`${campaign}: ${lastWfhResult.added} new, ${lastWfhResult.updated} updated, ${lastWfhResult.duplicates} duplicate`);
    }catch(e){ console.error(e); ubtn.disabled = false; err('Could not read or save that file \u2014 ' + (e && e.message ? e.message : 'make sure it is the WFH PASS Excel.')); }
  });
}

  const meta = STATE.attendanceUploadMeta;


  const tabBar = `
  <div style="display:flex; gap:8px; margin-top:0; flex-wrap:wrap;">
    <button type="button" class="btn ${attendanceActiveTab==='summary'?'brass':'ghost'}" data-attendance-tab="summary">Monthly Attendance Summary</button>
    <button type="button" class="btn ${attendanceActiveTab==='trend'?'brass':'ghost'}" data-attendance-tab="trend">Monthly Absence Trend</button>
  </div>`;

  const tabContent = attendanceActiveTab==='trend' ? renderAttendanceTrendCard() : renderAttendanceSummaryCard();

  return `${tabBar}${tabContent}`;
}
function renderAttendanceSummaryCard(){
  const meta = STATE.attendanceUploadMeta;
  const allSummary = attendanceSummaryByEmployee(currentMonth);
  const summary = allSummary.filter(e=>summaryLeadMatch(e.empName, summaryLeadFilter.attendance));

  const rows = summary.map(emp=>{
    const streakBadge = emp.longestStreak>=3 ? 'red' : (emp.longestStreak===2 ? 'amber' : 'neutral');
    const streakLabel = emp.longestStreak>=2 ? `${emp.longestStreak}-day streak` : (emp.absences ? 'No streak' : '\u2014');
    const absenceDetail = emp.absentDates.length ? `
      <details>
        <summary style="cursor:pointer; color:var(--brass-dark); font-weight:600; font-size:12px;">View dates</summary>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${emp.streaks.map(s=>{
            const len = Math.round((new Date(s.end+'T00:00:00') - new Date(s.start+'T00:00:00'))/86400000) + 1;
            const label = s.start===s.end ? fmtDate(s.start) : `${fmtDate(s.start)} \u2013 ${fmtDate(s.end)}`;
            return `<span class="badge ${len>=2?'red':'neutral'}">${esc(label)}${len>=2?` (${len}d)`:''}</span>`;
          }).join('')}
        </div>
      </details>` : '<span style="color:var(--slate-soft);">\u2014</span>';
    return `<tr data-summary-row data-summary-search="${esc(toTitleCaseName(emp.empName).toLowerCase())}">
      <td style="font-weight:600;">${esc(toTitleCaseName(emp.empName))}</td>
      <td>${teamLeadCellHtml(emp)}</td>
      <td class="num">${emp.present}</td>
      <td class="num">${emp.restday}</td>
      <td class="num">${emp.vl}</td>
      <td class="num">${emp.el}</td>
      <td class="num">${emp.absences ? `<span class="badge ${emp.absences>=2?'amber':'neutral'}">${emp.absences}</span>` : '<span style="color:var(--slate-soft);">0</span>'}</td>
      <td class="num"><span class="badge ${streakBadge}">${streakLabel}</span></td>
      <td>${absenceDetail}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Monthly Attendance Summary</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">${monthLabel(currentMonth)} &middot; use the Month selector at the top to change it</span>
    </div>
    <div class="card-body">
      ${summaryFilterBar('attendance')}
      <div style="overflow-x:auto;">
      ${allSummary.length ? `
      <table id="attendanceTable">
        <thead><tr><th>Employee</th><th>Team Lead</th><th>Present</th><th>Rest Day</th><th>Vacation Leave</th><th>Emergency Leave</th><th>Absences</th><th>Longest Streak</th><th>Absence Dates</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${summary.length ? '' : '<p class="field-hint">No agents for this team lead in this month.</p>'}
      <p class="field-hint" id="attendanceSearchEmpty" style="display:none;">No agents match that search.</p>
      <p class="field-hint" style="margin-top:14px;">\u201cAbsences\u201d is strictly \u201cAbsent\u201d and \u201cSick Leave\u201d remarks \u2014 \u201cNo Login\u201d is excluded. It also counts occurrences, not raw days: a run of consecutive Absent/Sick Leave days counts as 1. A Rest Day in between doesn\u2019t break the streak (e.g. Sick Leave \u2192 Rest Day \u2192 Absent still counts as 1 occurrence), but a Present or Vacation Leave day in between does \u2014 that starts a new, separate occurrence. \u201cLongest Streak\u201d is the longest single run, in days.</p>
      ` : emptyState('No attendance data for this month', meta ? `Nothing in the uploaded file falls in ${monthLabel(currentMonth)} \u2014 try a different month above.` : 'Upload an attendance file in Settings to see the monthly breakdown.', null, null)}
      </div>
    </div>
  </div>
  `;
}
function renderAttendanceTrendCard(){ return renderOnsiteTrendCard('attendance'); }

/* ======================================================================
   TARDINESS
   ====================================================================== */
function renderTardiness(){
  const meta = STATE.attendanceUploadMeta;
  const banner = `
  <div class="card">
    <div class="card-body" style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
      <p style="margin:0; font-size:13px; color:var(--slate);">Tardiness is tracked from the same attendance file uploaded in <strong>Settings</strong> \u2014 a day counts as late only when its <strong>Remarks</strong> says \u201cLate\u201d and isn\u2019t a Holiday remark, then the minutes are calculated by comparing <strong>SchedIn</strong> vs <strong>TimeIn</strong> for that day, rather than trusting the file\u2019s own Late column. ${meta ? `Currently using <strong>${esc(meta.fileName||'the uploaded file')}</strong> (${meta.rowCount} rows, uploaded ${new Date(meta.uploadedAt).toLocaleString('en-US',{month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'})}).` : 'No attendance file has been uploaded yet.'}</p>
      <button type="button" class="btn ghost sm" data-goto="settings">${meta ? 'Go to Settings' : 'Upload a File'}</button>
    </div>
  </div>`;

  const tabBar = `
  <div style="display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;">
    <button type="button" class="btn ${tardinessActiveTab==='trend'?'ghost':'brass'}" data-tardiness-tab="summary">Monthly Tardiness</button>
    <button type="button" class="btn ${tardinessActiveTab==='trend'?'brass':'ghost'}" data-tardiness-tab="trend">Tardiness Trend</button>
  </div>`;

  const tabContent = tardinessActiveTab==='trend' ? renderTardinessTrendCard() : renderTardinessSummaryCard();

  return `${banner}${tabBar}${tabContent}`;
}
function renderTardinessSummaryCard(){
  const allSummary = tardinessSummaryByEmployee(currentMonth);
  const summary = allSummary.filter(e=>summaryLeadMatch(e.empName, summaryLeadFilter.tardiness));
  const summaryRows = summary.map(emp=>{
    const longestBadge = emp.longestMinutes>10 ? 'red' : (emp.longestMinutes>0 ? 'amber' : 'neutral');
    const detail = emp.instances.length ? `
      <details>
        <summary style="cursor:pointer; color:var(--brass-dark); font-weight:600; font-size:12px;">View dates</summary>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${emp.instances.map(i=>`<span class="badge ${i.minutes>10?'red':'amber'}">${esc(fmtDate(i.date))} (${i.minutes} min)</span>`).join('')}
        </div>
      </details>` : '<span style="color:var(--slate-soft);">\u2014</span>';
    return `<tr data-summary-row data-summary-search="${esc(toTitleCaseName(emp.empName).toLowerCase())}">
      <td style="font-weight:600;">${esc(toTitleCaseName(emp.empName))}</td>
      <td>${teamLeadCellHtml(emp)}</td>
      <td class="num">${emp.count ? `<span class="badge ${emp.count>=2?'amber':'neutral'}">${emp.count}</span>` : '<span style="color:var(--slate-soft);">0</span>'}</td>
      <td class="num">${emp.totalMinutes || '<span style="color:var(--slate-soft);">0</span>'}</td>
      <td class="num"><span class="badge ${longestBadge}">${emp.longestMinutes || 0} min</span></td>
      <td>${detail}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Monthly Tardiness Summary</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">${monthLabel(currentMonth)} &middot; based on SchedIn vs TimeIn in the uploaded attendance file</span>
    </div>
    <div class="card-body">
      ${summaryFilterBar('tardiness')}
      <div style="overflow-x:auto;">
      ${allSummary.length ? `
      <table id="tardinessTable">
        <thead><tr><th>Employee</th><th>Team Lead</th><th>Late Instances</th><th>Total Minutes Late</th><th>Longest Lateness</th><th>Late Dates</th></tr></thead>
        <tbody>${summaryRows}</tbody>
      </table>
      ${summary.length ? '' : '<p class="field-hint">No agents for this team lead in this month.</p>'}
      <p class="field-hint" id="tardinessSearchEmpty" style="display:none;">No agents match that search.</p>
      <p class="field-hint" style="margin-top:14px;">A day counts as a tardiness instance only when its Remarks says "Late" (e.g. "Present-Late") and isn\u2019t a Holiday remark \u2014 the minutes shown are then the SchedIn-to-TimeIn difference for that day.</p>
      ` : emptyState('No tardiness on file for this month', 'Either nobody was late, or the uploaded file has no SchedIn/TimeIn columns \u2014 try a different month above, or upload a file in Settings.', null, null)}
      </div>
    </div>
  </div>
  `;
}
function renderTardinessTrendCard(){ return renderOnsiteTrendCard('tardiness'); }

/* ======================================================================
   AGENT ROSTER (supporting page for Team Lead data used by both sections)
   ====================================================================== */
/* ---------------------- SHARED EMPTY STATE ---------------------- */
function emptyState(title, sub, gotoView, cta){
  return `<div class="empty-state">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
    <h4>${esc(title)}</h4>
    <p>${esc(sub)}</p>
    ${gotoView?`<button class="btn ghost" data-goto="${gotoView}">${esc(cta)}</button>`:''}
  </div>`;
}

/* ======================================================================
   EVENT HANDLERS PER VIEW
   ====================================================================== */
function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>{ if(b.dataset.goto==='settings') settingsTab = b.dataset.gotoTab || 'upload'; setView(b.dataset.goto); }));

  if(currentView==='attendanceImport' || (currentView==='settings' && settingsTab==='upload')){
    document.querySelectorAll('[data-attendance-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ attendanceActiveTab = btn.dataset.attendanceTab; render(); });
    });
    const attBtn = document.getElementById('attendanceUploadBtn');
    if(attBtn){
      attBtn.addEventListener('click', async ()=>{
        const fileInput = document.getElementById('attendanceUploadFile');
        const hint = document.getElementById('attendanceUploadHint');
        const file = fileInput.files[0];
        if(!file){ hint.style.color='var(--red)'; hint.textContent='Choose a .csv, .xls, or .xlsx file first.'; return; }
        if(typeof XLSX === 'undefined'){ hint.style.color='var(--red)'; hint.textContent='Spreadsheet reader failed to load \u2014 check your connection and try again.'; return; }
        const by = rememberUploader('attendanceUploader');
        try{
          attBtn.disabled = true;
          hint.style.color='var(--slate-soft)'; hint.textContent='Reading file\u2026';
          const rows = parseAttendanceWorkbook(await file.arrayBuffer());
          if(!rows.length){
            hint.style.color='var(--red)';
            hint.textContent='Couldn\u2019t find any rows with EmpName and Date1 columns in this file.';
            attBtn.disabled = false;
            return;
          }
          hint.textContent = FB.ready ? `Saving ${rows.length.toLocaleString()} rows to Firebase\u2026` : 'Saving\u2026';
          lastAttendanceResult = await applyAttendanceUpload(rows, file.name, by);
          if(lastAttendanceResult.latestMonth){ currentMonth = lastAttendanceResult.latestMonth; try{ localStorage.setItem(LAST_MONTH_KEY, currentMonth); }catch(e){} }
          populateGlobalMonth();
          render();
          toast(`Uploaded \u2014 ${lastAttendanceResult.added.toLocaleString()} new, ${lastAttendanceResult.updated.toLocaleString()} updated, ${lastAttendanceResult.duplicates.toLocaleString()} duplicate`);
        }catch(err){
          console.error(err);
          hint.style.color='var(--red)';
          hint.textContent='Could not save that file \u2014 ' + (err && err.message ? err.message : 'make sure it is a valid attendance export.');
          attBtn.disabled = false;
        }
      });
    }
    const attClearBtn = document.getElementById('attendanceClearBtn');
    if(attClearBtn){
      attClearBtn.addEventListener('click', async ()=>{
        if(!confirm('Clear ALL attendance data for everyone using this dashboard? This can\u2019t be undone \u2014 you can always upload the file again.')) return;
        await clearAttendanceLogs();
        lastAttendanceResult = null;
        render();
        toast('Attendance data cleared');
      });
    }
  }

  if(currentView==='tardiness'){
    document.querySelectorAll('[data-tardiness-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ tardinessActiveTab = btn.dataset.tardinessTab; render(); });
    });
  }

}

/* ======================================================================
   INIT
   ====================================================================== */
async function init(){
  await loadState();
  initialDone = true;

  document.getElementById('globalMonth').addEventListener('change', (e)=>{
    currentMonth = e.target.value;
    try{ localStorage.setItem(LAST_MONTH_KEY, currentMonth); }catch(err){}
    render();
  });
  document.getElementById('saveStatus').addEventListener('click', ()=>{
    if(!document.getElementById('saveStatus').classList.contains('error')) return;
    if(getFirebaseConfig() && !FB.ready) reconnectFirebase(); else saveState();
  });

  // open on the most recent month that actually has attendance data
  const months = attendanceMonthsAvailable();
  let saved = null; try{ saved = localStorage.getItem(LAST_MONTH_KEY); }catch(e){}
  if(!saved && months.length) currentMonth = months[months.length-1];

  setView('overview');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
}
init();
</script>
